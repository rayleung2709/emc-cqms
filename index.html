<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clinic Queue Management</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --primary: #2563eb;
      --danger: #dc2626;
      --warn: #d97706;
      --success: #059669;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 1400px;
      margin: 0 auto;
      padding: 16px;
    }

    h1, h2, h3 {
      margin: 0 0 12px 0;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid-2 {
      grid-template-columns: 1fr 1fr;
    }

    .grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    input, select, button, textarea {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: white;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button.primary { background: var(--primary); }
    button.success { background: var(--success); }
    button.warn { background: var(--warn); }
    button.danger { background: var(--danger); }
    button.secondary { background: #4b5563; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: #f9fafb;
    }

    .pill.open { color: #065f46; background: #ecfdf5; border-color: #a7f3d0; }
    .pill.paused { color: #92400e; background: #fffbeb; border-color: #fcd34d; }
    .pill.closed { color: #991b1b; background: #fef2f2; border-color: #fca5a5; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .room-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: #fff;
    }

    .room-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .queue-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      background: #fafafa;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .message {
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      display: none;
    }

    .message.show { display: block; }
    .message.ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .message.err { background: #fef2f2; color: #991b1b; border: 1px solid #fca5a5; }

    @media (max-width: 960px) {
      .grid-2, .grid-3 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <div>
        <h1>Clinic Queue Management</h1>
        <div class="muted small">text-compatible version for <code>rooms.id = text</code></div>
      </div>
      <div class="row">
        <button class="secondary" id="refreshBtn">Refresh</button>
      </div>
    </div>

    <div id="message" class="message"></div>

    <div class="grid grid-2">
      <div class="card">
        <h2>新增房間</h2>
        <div class="col">
          <label>Room No
            <input id="roomNoInput" placeholder="例如：R1 / 101 / A診" />
          </label>
          <label>Doctor Name
            <input id="doctorNameInput" placeholder="例如：Dr. Chan" />
          </label>
          <div class="row">
            <button class="primary" id="addRoomBtn">新增房間</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>新增病人</h2>
        <div class="col">
          <label>Ticket No
            <input id="ticketNoInput" placeholder="例如：A001" />
          </label>
          <label>CUMC No
            <input id="cumcNoInput" placeholder="例如：C123456" />
          </label>
          <label>Source Type
            <select id="sourceTypeInput">
              <option value="walkin">walkin</option>
              <option value="onlineTicket">onlineTicket</option>
              <option value="appointment">appointment</option>
            </select>
          </label>
          <label>Assign Room
            <select id="roomSelect">
              <option value="">Unassigned</option>
            </select>
          </label>
          <label class="row">
            <input type="checkbox" id="priorityInput" style="width:auto;" />
            <span>Priority</span>
          </label>
          <div class="row">
            <button class="primary" id="addPatientBtn">新增病人</button>
          </div>
        </div>
      </div>
    </div>

    <div style="height:16px;"></div>

    <div class="grid grid-2">
      <div class="card">
        <h2>房間與隊列</h2>
        <div id="roomsContainer" class="grid"></div>
      </div>

      <div class="card">
        <h2>未分配病人</h2>
        <div id="unassignedContainer"></div>
      </div>
    </div>

    <div style="height:16px;"></div>

    <div class="card">
      <div class="toolbar">
        <div>
          <h2>Archive</h2>
          <div class="muted small">已完成 / 已取消</div>
        </div>
        <div class="row">
          <input id="archiveSearchInput" placeholder="搜尋 ticket_no / cumc_no / room_no" style="min-width:260px;" />
          <button class="secondary" id="searchArchiveBtn">搜尋</button>
        </div>
      </div>
      <div style="overflow:auto;">
        <table>
          <thead>
            <tr>
              <th>Ticket</th>
              <th>CUMC</th>
              <th>Status</th>
              <th>Room</th>
              <th>Doctor</th>
              <th>Registered</th>
              <th>Done / Cancelled</th>
            </tr>
          </thead>
          <tbody id="archiveTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dvyberdrmmfgutjqnpjr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2eWJlcmRybW1mZ3V0anFucGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MDc3NTMsImV4cCI6MjA5MTQ4Mzc1M30.9aRRSP2xAAozx2bxH9a1Z13tDDwot82Mb8ax5hxirck';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const els = {
      message: document.getElementById('message'),
      refreshBtn: document.getElementById('refreshBtn'),

      roomNoInput: document.getElementById('roomNoInput'),
      doctorNameInput: document.getElementById('doctorNameInput'),
      addRoomBtn: document.getElementById('addRoomBtn'),

      ticketNoInput: document.getElementById('ticketNoInput'),
      cumcNoInput: document.getElementById('cumcNoInput'),
      sourceTypeInput: document.getElementById('sourceTypeInput'),
      roomSelect: document.getElementById('roomSelect'),
      priorityInput: document.getElementById('priorityInput'),
      addPatientBtn: document.getElementById('addPatientBtn'),

      roomsContainer: document.getElementById('roomsContainer'),
      unassignedContainer: document.getElementById('unassignedContainer'),

      archiveSearchInput: document.getElementById('archiveSearchInput'),
      searchArchiveBtn: document.getElementById('searchArchiveBtn'),
      archiveTableBody: document.getElementById('archiveTableBody'),
    };

    function showMessage(text, type = 'ok') {
      els.message.className = 'message show ' + (type === 'err' ? 'err' : 'ok');
      els.message.textContent = text;
      setTimeout(() => {
        els.message.className = 'message';
      }, 3500);
    }

    function fmt(dt) {
      if (!dt) return '';
      const d = new Date(dt);
      if (Number.isNaN(d.getTime())) return dt;
      return d.toLocaleString();
    }

    async function fetchRooms() {
      const { data, error } = await supabase
        .from('rooms')
        .select('*')
        .order('sort_order', { ascending: true })
        .order('room_no', { ascending: true });

      if (error) throw error;
      return data || [];
    }

    async function fetchPatients() {
      const { data, error } = await supabase
        .from('patients')
        .select('*')
        .order('priority', { ascending: false })
        .order('queue_order', { ascending: true, nullsFirst: false })
        .order('registered_at', { ascending: true });

      if (error) throw error;
      return data || [];
    }

    async function fetchArchive(keyword = '') {
      let query = supabase
        .from('patients_archive')
        .select('*')
        .order('archived_at', { ascending: false })
        .limit(100);

      if (keyword && keyword.trim()) {
        const k = keyword.trim();
        query = query.or(
          `ticket_no.ilike.%${k}%,cumc_no.ilike.%${k}%,room_no_snapshot.ilike.%${k}%,doctor_name_snapshot.ilike.%${k}%`
        );
      }

      const { data, error } = await query;
      if (error) throw error;
      return data || [];
    }

    async function getNextQueueOrder(roomId) {
      const { data, error } = await supabase
        .from('patients')
        .select('queue_order')
        .eq('room_id', roomId)
        .order('queue_order', { ascending: false })
        .limit(1);

      if (error) throw error;
      const max = data && data.length ? (data[0].queue_order || 0) : 0;
      return max + 1;
    }

    async function addRoom() {
      const roomNo = els.roomNoInput.value.trim();
      const doctorName = els.doctorNameInput.value.trim();

      if (!roomNo) {
        showMessage('請輸入 Room No', 'err');
        return;
      }

      const room = {
        id: crypto.randomUUID(),
        room_no: roomNo,
        doctor_name: doctorName || '',
        status: 'open',
        pause_reason: '',
        accepting_new: true,
        current_patient_id: null,
        sort_order: 0,
      };

      const { error } = await supabase.from('rooms').insert(room);
      if (error) throw error;

      els.roomNoInput.value = '';
      els.doctorNameInput.value = '';
      showMessage('房間已新增');
      await refreshAll();
    }

    async function addPatient() {
      const ticketNo = els.ticketNoInput.value.trim();
      const cumcNo = els.cumcNoInput.value.trim();
      const sourceType = els.sourceTypeInput.value;
      const roomId = els.roomSelect.value || null;
      const priority = !!els.priorityInput.checked;

      if (!ticketNo) {
        showMessage('請輸入 Ticket No', 'err');
        return;
      }
      if (!cumcNo) {
        showMessage('請輸入 CUMC No', 'err');
        return;
      }

      let queueOrder = null;
      let initialAssignmentMode = 'auto';

      if (roomId) {
        queueOrder = await getNextQueueOrder(roomId);
      }

      const patient = {
        id: crypto.randomUUID(),
        ticket_no: ticketNo,
        cumc_no: cumcNo,
        room_id: roomId,
        source_type: sourceType,
        priority,
        registered_at: new Date().toISOString(),
        status: 'waiting',
        queue_order: queueOrder,
        created_at: new Date().toISOString(),
        called_at: null,
        skipped_at: null,
        initial_assignment_mode: initialAssignmentMode,
        manual_lock: false,
        manual_lock_reason: null,
        logs_json: [],
      };

      const { error } = await supabase.from('patients').insert(patient);
      if (error) throw error;

      els.ticketNoInput.value = '';
      els.cumcNoInput.value = '';
      els.priorityInput.checked = false;
      els.roomSelect.value = '';

      showMessage('病人已新增');
      await refreshAll();
    }

    async function updateRoomStatus(roomId, status) {
      const payload = {
        status,
        accepting_new: status === 'open',
        pause_reason: status === 'paused' ? 'manual pause' : '',
      };

      const { error } = await supabase
        .from('rooms')
        .update(payload)
        .eq('id', roomId);

      if (error) throw error;
      showMessage('房間狀態已更新');
      await refreshAll();
    }

    async function assignPatient(patientId, roomId) {
      const queueOrder = await getNextQueueOrder(roomId);
      const { error } = await supabase
        .from('patients')
        .update({
          room_id: roomId,
          queue_order: queueOrder,
          initial_assignment_mode: 'manual',
          manual_lock: true,
          manual_lock_reason: 'manual assign',
        })
        .eq('id', patientId);

      if (error) throw error;
      showMessage('病人已分配到房間');
      await refreshAll();
    }

    async function callNextPatient(roomId) {
      const { data, error } = await supabase
        .from('patients')
        .select('*')
        .eq('room_id', roomId)
        .eq('status', 'waiting')
        .order('priority', { ascending: false })
        .order('queue_order', { ascending: true, nullsFirst: false })
        .order('registered_at', { ascending: true })
        .limit(1);

      if (error) throw error;
      if (!data || !data.length) {
        showMessage('此房間沒有等待中的病人', 'err');
        return;
      }

      const patient = data[0];

      const { error: e1 } = await supabase
        .from('patients')
        .update({
          status: 'called',
          called_at: new Date().toISOString(),
        })
        .eq('id', patient.id);

      if (e1) throw e1;

      const { error: e2 } = await supabase
        .from('rooms')
        .update({
          current_patient_id: patient.id,
        })
        .eq('id', roomId);

      if (e2) throw e2;

      showMessage('已呼叫下一位病人');
      await refreshAll();
    }

    async function skipPatient(patientId, roomId) {
      const { error: e1 } = await supabase
        .from('patients')
        .update({
          status: 'skipped',
          skipped_at: new Date().toISOString(),
        })
        .eq('id', patientId);

      if (e1) throw e1;

      const { error: e2 } = await supabase
        .from('rooms')
        .update({
          current_patient_id: null,
        })
        .eq('id', roomId);

      if (e2) throw e2;

      showMessage('病人已略過');
      await refreshAll();
    }

    async function archivePatient(patientId, finalStatus) {
      const { data: patient, error: pErr } = await supabase
        .from('patients')
        .select('*')
        .eq('id', patientId)
        .single();

      if (pErr) throw pErr;

      let room = null;
      if (patient.room_id) {
        const { data: roomData } = await supabase
          .from('rooms')
          .select('*')
          .eq('id', patient.room_id)
          .maybeSingle();
        room = roomData || null;
      }

      const now = new Date().toISOString();

      const archiveRow = {
        id: patient.id,
        ticket_no: patient.ticket_no,
        cumc_no: patient.cumc_no,
        room_id: patient.room_id,
        room_no_snapshot: room ? room.room_no : null,
        doctor_name_snapshot: room ? room.doctor_name : null,
        source_type: patient.source_type || 'walkin',
        priority: !!patient.priority,
        registered_at: patient.registered_at || now,
        status: finalStatus,
        queue_order: patient.queue_order,
        created_at: patient.created_at || now,
        called_at: patient.called_at,
        skipped_at: patient.skipped_at,
        done_at: finalStatus === 'done' ? now : null,
        cancelled_at: finalStatus === 'cancelled' ? now : null,
        initial_assignment_mode: patient.initial_assignment_mode || 'auto',
        manual_lock: !!patient.manual_lock,
        manual_lock_reason: patient.manual_lock_reason,
        logs_json: patient.logs_json || [],
        archived_at: now,
        archive_reason: 'ui-finalized',
      };

      const { error: aErr } = await supabase.from('patients_archive').insert(archiveRow);
      if (aErr) throw aErr;

      const { error: dErr } = await supabase.from('patients').delete().eq('id', patientId);
      if (dErr) throw dErr;

      if (patient.room_id) {
        await supabase
          .from('rooms')
          .update({ current_patient_id: null })
          .eq('id', patient.room_id);
      }

      showMessage(finalStatus === 'done' ? '病人已完成並封存' : '病人已取消並封存');
      await refreshAll();
    }

    function renderRoomSelect(rooms) {
      const current = els.roomSelect.value;
      els.roomSelect.innerHTML = '<option value="">Unassigned</option>';
      rooms.forEach(room => {
        const opt = document.createElement('option');
        opt.value = room.id;
        opt.textContent = `${room.room_no}${room.doctor_name ? ' - ' + room.doctor_name : ''}`;
        els.roomSelect.appendChild(opt);
      });
      if ([...els.roomSelect.options].some(o => o.value === current)) {
        els.roomSelect.value = current;
      }
    }

    function renderUnassigned(patients, rooms) {
      const list = patients.filter(p => !p.room_id);
      if (!list.length) {
        els.unassignedContainer.innerHTML = '<div class="muted">目前沒有未分配病人</div>';
        return;
      }

      els.unassignedContainer.innerHTML = list.map(p => `
        <div class="queue-item">
          <div><strong>${escapeHtml(p.ticket_no)}</strong> / ${escapeHtml(p.cumc_no)}</div>
          <div class="small muted">source: ${escapeHtml(p.source_type || '')} ${p.priority ? ' | priority' : ''}</div>
          <div class="small muted">registered: ${fmt(p.registered_at)}</div>
          <div class="row" style="margin-top:8px;">
            <select id="assign-${p.id}">
              <option value="">選擇房間</option>
              ${rooms.map(r => `<option value="${escapeHtml(r.id)}">${escapeHtml(r.room_no)}${r.doctor_name ? ' - ' + escapeHtml(r.doctor_name) : ''}</option>`).join('')}
            </select>
            <button class="primary" onclick="window.handleAssign('${p.id}')">分配</button>
            <button class="danger" onclick="window.handleCancel('${p.id}')">取消</button>
          </div>
        </div>
      `).join('');
    }

    function renderRooms(rooms, patients) {
      if (!rooms.length) {
        els.roomsContainer.innerHTML = '<div class="muted">尚未建立房間</div>';
        return;
      }

      els.roomsContainer.innerHTML = rooms.map(room => {
        const roomPatients = patients.filter(p => p.room_id === room.id);
        const current = room.current_patient_id
          ? roomPatients.find(p => p.id === room.current_patient_id) || null
          : null;

        const waiting = roomPatients.filter(p => p.status === 'waiting' || p.status === 'skipped')
          .sort((a, b) => {
            if ((b.priority ? 1 : 0) !== (a.priority ? 1 : 0)) return (b.priority ? 1 : 0) - (a.priority ? 1 : 0);
            return (a.queue_order || 999999) - (b.queue_order || 999999);
          });

        return `
          <div class="room-card">
            <div class="room-head">
              <div>
                <div><strong>${escapeHtml(room.room_no)}</strong></div>
                <div class="small muted">${escapeHtml(room.doctor_name || '')}</div>
                <div style="margin-top:6px;">
                  <span class="pill ${escapeHtml(room.status)}">${escapeHtml(room.status)}</span>
                </div>
              </div>
              <div class="row">
                <button class="secondary" onclick="window.handleRoomStatus('${room.id}','open')">Open</button>
                <button class="warn" onclick="window.handleRoomStatus('${room.id}','paused')">Pause</button>
                <button class="danger" onclick="window.handleRoomStatus('${room.id}','closed')">Close</button>
              </div>
            </div>

            <div class="card" style="padding:12px; margin-bottom:12px;">
              <div class="small muted">Current Patient</div>
              ${
                current
                  ? `
                    <div style="margin-top:6px;"><strong>${escapeHtml(current.ticket_no)}</strong> / ${escapeHtml(current.cumc_no)}</div>
                    <div class="row" style="margin-top:8px;">
                      <button class="success" onclick="window.handleDone('${current.id}')">完成</button>
                      <button class="warn" onclick="window.handleSkip('${current.id}','${room.id}')">略過</button>
                      <button class="danger" onclick="window.handleCancel('${current.id}')">取消</button>
                    </div>
                  `
                  : `
                    <div style="margin-top:6px;" class="muted">目前沒有正在看診病人</div>
                    <div class="row" style="margin-top:8px;">
                      <button class="primary" onclick="window.handleCallNext('${room.id}')">Call Next</button>
                    </div>
                  `
              }
            </div>

            <div>
              <div class="small muted">Queue</div>
              ${
                waiting.length
                  ? waiting.map(p => `
                    <div class="queue-item">
                      <div><strong>${escapeHtml(p.ticket_no)}</strong> / ${escapeHtml(p.cumc_no)}</div>
                      <div class="small muted">
                        status: ${escapeHtml(p.status)}
                        ${p.priority ? ' | priority' : ''}
                        ${p.queue_order !== null && p.queue_order !== undefined ? ' | q=' + escapeHtml(String(p.queue_order)) : ''}
                      </div>
                      <div class="row" style="margin-top:8px;">
                        <button class="primary" onclick="window.handleCallSpecific('${p.id}','${room.id}')">呼叫此位</button>
                        <button class="danger" onclick="window.handleCancel('${p.id}')">取消</button>
                      </div>
                    </div>
                  `).join('')
                  : '<div class="muted" style="margin-top:8px;">目前沒有排隊病人</div>'
              }
            </div>
          </div>
        `;
      }).join('');
    }

    function renderArchive(rows) {
      if (!rows.length) {
        els.archiveTableBody.innerHTML = `
          <tr><td colspan="7" class="muted">沒有資料</td></tr>
        `;
        return;
      }

      els.archiveTableBody.innerHTML = rows.map(r => `
        <tr>
          <td>${escapeHtml(r.ticket_no || '')}</td>
          <td>${escapeHtml(r.cumc_no || '')}</td>
          <td>${escapeHtml(r.status || '')}</td>
          <td>${escapeHtml(r.room_no_snapshot || '')}</td>
          <td>${escapeHtml(r.doctor_name_snapshot || '')}</td>
          <td>${fmt(r.registered_at)}</td>
          <td>${fmt(r.done_at || r.cancelled_at || r.archived_at)}</td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function callSpecificPatient(patientId, roomId) {
      const { error: e1 } = await supabase
        .from('patients')
        .update({
          status: 'called',
          called_at: new Date().toISOString(),
        })
        .eq('id', patientId);

      if (e1) throw e1;

      const { error: e2 } = await supabase
        .from('rooms')
        .update({
          current_patient_id: patientId,
        })
        .eq('id', roomId);

      if (e2) throw e2;

      showMessage('已呼叫指定病人');
      await refreshAll();
    }

    async function refreshAll() {
      const [rooms, patients, archive] = await Promise.all([
        fetchRooms(),
        fetchPatients(),
        fetchArchive(els.archiveSearchInput.value.trim()),
      ]);

      renderRoomSelect(rooms);
      renderRooms(rooms, patients);
      renderUnassigned(patients, rooms);
      renderArchive(archive);
    }

    window.handleAssign = async function(patientId) {
      try {
        const sel = document.getElementById('assign-' + patientId);
        const roomId = sel ? sel.value : '';
        if (!roomId) {
          showMessage('請先選擇房間', 'err');
          return;
        }
        await assignPatient(patientId, roomId);
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Assign failed', 'err');
      }
    };

    window.handleRoomStatus = async function(roomId, status) {
      try {
        await updateRoomStatus(roomId, status);
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Update room failed', 'err');
      }
    };

    window.handleCallNext = async function(roomId) {
      try {
        await callNextPatient(roomId);
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Call next failed', 'err');
      }
    };

    window.handleCallSpecific = async function(patientId, roomId) {
      try {
        await callSpecificPatient(patientId, roomId);
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Call specific failed', 'err');
      }
    };

    window.handleSkip = async function(patientId, roomId) {
      try {
        await skipPatient(patientId, roomId);
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Skip failed', 'err');
      }
    };

    window.handleDone = async function(patientId) {
      try {
        await archivePatient(patientId, 'done');
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Done failed', 'err');
      }
    };

    window.handleCancel = async function(patientId) {
      try {
        await archivePatient(patientId, 'cancelled');
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Cancel failed', 'err');
      }
    };

    els.addRoomBtn.addEventListener('click', async () => {
      try {
        await addRoom();
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Add room failed', 'err');
      }
    });

    els.addPatientBtn.addEventListener('click', async () => {
      try {
        await addPatient();
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Add patient failed', 'err');
      }
    });

    els.refreshBtn.addEventListener('click', async () => {
      try {
        await refreshAll();
        showMessage('資料已更新');
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Refresh failed', 'err');
      }
    });

    els.searchArchiveBtn.addEventListener('click', async () => {
      try {
        const rows = await fetchArchive(els.archiveSearchInput.value.trim());
        renderArchive(rows);
      } catch (err) {
        console.error(err);
        showMessage(err.message || 'Archive search failed', 'err');
      }
    });

    refreshAll().catch(err => {
      console.error(err);
      showMessage(err.message || 'Initial load failed', 'err');
    });
  </script>
</body>
</html>

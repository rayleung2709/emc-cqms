<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMCQMS 跟進工作台</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f3f6fb;
      --card: #ffffff;
      --line: #dbe3ee;
      --line-soft: #e8eef6;
      --text: #1f2937;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --soft: #f8fafc;
      --shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
      --radius: 18px;

      --timeline-event-bg: #eff6ff;
      --timeline-event-border: #93c5fd;
      --timeline-comment-bg: #f8fafc;
      --timeline-comment-border: #cbd5e1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body.modal-open {
      overflow: hidden;
    }

    .app {
      max-width: 1600px;
      margin: 0 auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.2;
    }

    .topbar-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 14px;
      color: #0f172a;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.92rem;
      font-weight: 800;
      color: #334155;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 0.98rem;
      background: #fff;
      color: var(--text);
      font-family: inherit;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input[disabled], select[disabled], textarea[disabled] {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.94rem;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-secondary { background: #e2e8f0; color: #0f172a; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-small {
      padding: 7px 10px;
      font-size: 0.82rem;
      border-radius: 9px;
    }

    .muted {
      color: var(--muted);
    }

    .auth-box {
      min-width: 320px;
      max-width: 420px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .search-help-note {
      margin-top: 8px;
      color: #64748b;
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.5;
    }

    .summary-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    .summary-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 14px;
    }

    .summary-label {
      font-size: 0.84rem;
      color: #64748b;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 1.45rem;
      color: #0f172a;
      font-weight: 900;
      line-height: 1.2;
    }

    .summary-sub {
      margin-top: 6px;
      color: #64748b;
      font-size: 0.86rem;
      font-weight: 800;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      background: transparent;
    }

    thead th {
      text-align: left;
      padding: 0 10px 4px 10px;
      color: #475569;
      font-size: 0.78rem;
      font-weight: 900;
      background: transparent;
      vertical-align: top;
    }

    tbody td {
      background: #fff;
      padding: 10px 10px;
      vertical-align: top;
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      font-size: 0.9rem;
    }

    tbody tr td:first-child {
      border-left: 1px solid var(--line-soft);
      border-top-left-radius: 14px;
      border-bottom-left-radius: 14px;
    }

    tbody tr td:last-child {
      border-right: 1px solid var(--line-soft);
      border-top-right-radius: 14px;
      border-bottom-right-radius: 14px;
    }

    .followup-title {
      font-size: 1rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.35;
    }

    .followup-sub {
      margin-top: 4px;
      color: #64748b;
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.35;
    }

    .followup-meta-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 900;
      line-height: 1.05;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .pill-category {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #93c5fd;
    }

    .pill-source {
      background: #f8fafc;
      color: #334155;
      border-color: #cbd5e1;
    }

    .pill-requested {
      background: #f5f3ff;
      color: #6d28d9;
      border-color: #c4b5fd;
    }

    .pill-priority-low {
      background: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }
    .pill-priority-normal {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #93c5fd;
    }
    .pill-priority-high {
      background: #fff7ed;
      color: #c2410c;
      border-color: #fdba74;
    }
    .pill-priority-urgent {
      background: #fef2f2;
      color: #b91c1c;
      border-color: #fca5a5;
    }

    .pill-status-open {
      background: #dbeafe;
      color: #1d4ed8;
      border-color: #93c5fd;
    }
    .pill-status-in_progress {
      background: #fef3c7;
      color: #92400e;
      border-color: #fcd34d;
    }
    .pill-status-pending {
      background: #ede9fe;
      color: #6d28d9;
      border-color: #c4b5fd;
    }
    .pill-status-completed {
      background: #dcfce7;
      color: #166534;
      border-color: #86efac;
    }
    .pill-status-cancelled {
      background: #f3f4f6;
      color: #6b7280;
      border-color: #d1d5db;
    }

    .danger-text {
      color: #b91c1c;
      font-weight: 900;
    }

    .result-summary {
      margin-top: 4px;
      margin-bottom: 12px;
      color: #475569;
      font-weight: 900;
      font-size: 0.92rem;
    }

    .empty-box {
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 26px;
      text-align: center;
      background: #f8fafc;
      color: #64748b;
      font-weight: 900;
    }

    .toast-wrap {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 9999;
    }

    .toast {
      min-width: 240px;
      max-width: 520px;
      padding: 12px 14px;
      border-radius: 14px;
      color: #fff;
      font-weight: 800;
      box-shadow: var(--shadow);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .toast.success { background: #16a34a; }
    .toast.warning { background: #d97706; }
    .toast.error { background: #dc2626; }
    .toast.info { background: #2563eb; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 30000;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal-card {
      width: min(1100px, 100%);
      max-height: min(92vh, 960px);
      overflow: auto;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.28);
      border: 1px solid #dbe3ee;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding: 18px 18px 12px;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 5;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: #0f172a;
    }

    .modal-subtitle {
      margin-top: 6px;
      color: #475569;
      font-weight: 800;
      line-height: 1.45;
    }

    .modal-close-btn {
      background: #e2e8f0;
      color: #0f172a;
      border-radius: 999px;
      min-width: 42px;
      min-height: 42px;
      font-size: 1.1rem;
      line-height: 1;
    }

    .modal-body {
      padding: 16px 18px 18px;
    }

    .detail-hero {
      border: 1px solid #dbeafe;
      background: #f8fbff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .detail-hero-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .detail-hero-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: #0f172a;
      line-height: 1.35;
    }

    .detail-hero-sub {
      margin-top: 4px;
      color: #475569;
      font-weight: 800;
      line-height: 1.45;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .detail-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
    }

    .detail-label {
      font-size: 0.82rem;
      color: #64748b;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .detail-value {
      font-size: 0.95rem;
      color: #0f172a;
      font-weight: 900;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .section-card {
      margin-top: 14px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow: hidden;
      background: #fff;
    }

    .section-head {
      padding: 12px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
      font-weight: 900;
      color: #0f172a;
    }

    .section-body {
      padding: 14px;
    }

    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-item {
      border-radius: 14px;
      padding: 12px 14px;
      border: 1px solid transparent;
    }

    .timeline-item.event {
      background: var(--timeline-event-bg);
      border-color: var(--timeline-event-border);
    }

    .timeline-item.comment {
      background: var(--timeline-comment-bg);
      border-color: var(--timeline-comment-border);
    }

    .timeline-meta {
      color: #475569;
      font-size: 0.8rem;
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .timeline-title {
      font-size: 0.98rem;
      color: #0f172a;
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .timeline-body {
      font-size: 0.92rem;
      color: #334155;
      line-height: 1.55;
      font-weight: 700;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .inline-split {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 16px;
      align-items: start;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .mini-note {
      margin-top: 8px;
      color: #64748b;
      font-size: 0.88rem;
      font-weight: 800;
      line-height: 1.45;
    }

    .comment-box {
      margin-top: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 10px;
    }

    .comment-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .comment-row textarea {
      min-height: 100px;
    }

    @media (max-width: 1400px) {
      .grid-6, .grid-4, .grid-3, .grid-2,
      .summary-row, .detail-grid, .inline-split {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 900px) {
      .app { padding: 12px; }
      .grid-6, .grid-4, .grid-3, .grid-2,
      .summary-row, .detail-grid, .inline-split {
        grid-template-columns: 1fr;
      }

      table, thead, tbody, tr, th, td {
        display: block;
        width: 100%;
      }

      thead { display: none; }

      tbody tr { margin-bottom: 12px; }

      tbody td {
        border-left: 1px solid var(--line-soft) !important;
        border-right: 1px solid var(--line-soft) !important;
        border-radius: 0 !important;
      }

      tbody tr td:first-child {
        border-top-left-radius: 14px !important;
        border-top-right-radius: 14px !important;
        border-bottom-left-radius: 0 !important;
      }

      tbody tr td:last-child {
        border-bottom-left-radius: 14px !important;
        border-bottom-right-radius: 14px !important;
        border-top-right-radius: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="toast-wrap" id="toastWrap"></div>

  <div class="modal-backdrop" id="createFollowupModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="createFollowupModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="createFollowupModalTitle">新增跟進個案</div>
          <div class="modal-subtitle">建立一條新的 follow-up 工作項目，並自動寫入一條 created event。</div>
        </div>
        <button class="modal-close-btn" id="closeCreateFollowupModalBtn" type="button" aria-label="關閉">×</button>
      </div>
      <div class="modal-body">
        <div class="grid-3">
          <div class="form-row">
            <label for="createPatientId">病人 CUMC 號碼</label>
            <input id="createPatientId" type="text" placeholder="例如：CUMC123456" />
          </div>

          <div class="form-row">
            <label for="createEncounterId">來源 Encounter ID（可留空）</label>
            <input id="createEncounterId" type="text" placeholder="UUID，可留空" />
          </div>

          <div class="form-row">
            <label for="createCategory">類型</label>
            <select id="createCategory">
              <option value="insurance_form">Insurance Form / 保險表格</option>
              <option value="abnormal_result">Abnormal Result / 異常報告</option>
              <option value="callback">Callback / 回電</option>
              <option value="document_request">Document Request / 文件要求</option>
              <option value="return_visit">Return Visit / 回院安排</option>
              <option value="admin">Admin / 行政</option>
              <option value="other">Other / 其他</option>
            </select>
          </div>

          <div class="form-row">
            <label for="createTitle">標題</label>
            <input id="createTitle" type="text" placeholder="例如：Insurance claim form" />
          </div>

          <div class="form-row">
            <label for="createStatus">狀態</label>
            <select id="createStatus">
              <option value="open" selected>open</option>
              <option value="in_progress">in_progress</option>
              <option value="pending">pending</option>
              <option value="completed">completed</option>
              <option value="cancelled">cancelled</option>
            </select>
          </div>

          <div class="form-row">
            <label for="createPriority">優先級</label>
            <select id="createPriority">
              <option value="low">low</option>
              <option value="normal" selected>normal</option>
              <option value="high">high</option>
              <option value="urgent">urgent</option>
            </select>
          </div>

          <div class="form-row">
            <label for="createAssignedTo">指派給</label>
            <input id="createAssignedTo" type="text" placeholder="staff email / name / code" />
          </div>

          <div class="form-row">
            <label for="createDueAt">到期日</label>
            <input id="createDueAt" type="datetime-local" />
          </div>

          <div class="form-row">
            <label for="createSource">來源</label>
            <select id="createSource">
              <option value="">—</option>
              <option value="phone">phone</option>
              <option value="counter">counter</option>
              <option value="doctor">doctor</option>
              <option value="lab">lab</option>
              <option value="system">system</option>
              <option value="email">email</option>
              <option value="admin">admin</option>
              <option value="other">other</option>
            </select>
          </div>

          <div class="form-row">
            <label for="createRequestedBy">提出人</label>
            <select id="createRequestedBy">
              <option value="">—</option>
              <option value="patient">patient</option>
              <option value="doctor">doctor</option>
              <option value="nurse">nurse</option>
              <option value="admin">admin</option>
              <option value="external">external</option>
              <option value="system">system</option>
              <option value="other">other</option>
            </select>
          </div>
        </div>

        <div class="form-row" style="margin-top:14px;">
          <label for="createDescription">描述</label>
          <textarea id="createDescription" placeholder="請輸入詳細內容"></textarea>
        </div>

        <div class="mini-note">
          建立後，系統會自動新增一條 `followup_events.created` 記錄。
        </div>

        <div class="modal-actions">
          <button class="btn-secondary" id="cancelCreateFollowupBtn" type="button">取消</button>
          <button class="btn-primary" id="saveCreateFollowupBtn" type="button">建立個案</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="followupDetailModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="followupDetailModalTitle">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="followupDetailModalTitle">跟進個案詳情</div>
          <div class="modal-subtitle" id="followupDetailModalSubtitle">—</div>
        </div>
        <button class="modal-close-btn" id="closeFollowupDetailModalBtn" type="button" aria-label="關閉">×</button>
      </div>
      <div class="modal-body" id="followupDetailModalBody">
        <div class="empty-box">讀取中…</div>
      </div>
    </div>
  </div>

  <div class="app">
    <div class="topbar">
      <div class="title">
        跟進工作台<br />
        Follow-up Workbench
      </div>

      <div class="topbar-actions">
        <a href="index.html">
          <button class="btn-secondary" type="button">返回主系統</button>
        </a>
      </div>
    </div>

    <div class="panel auth-box">
      <div class="panel-title" style="margin-bottom:10px;">職員登入</div>

      <div id="loggedOutView">
        <div class="form-row" style="margin-bottom:8px;">
          <label for="loginEmail">CUMC 電郵</label>
          <input id="loginEmail" type="email" placeholder="試玩: petertmchan@cuhkmc.hk" autocomplete="username" />
        </div>

        <div class="form-row" style="margin-bottom:10px;">
          <label for="loginPassword">密碼</label>
          <input id="loginPassword" type="password" placeholder="試玩: 123456" autocomplete="current-password" />
        </div>

        <div class="actions" style="justify-content:flex-end;">
          <button class="btn-primary" id="loginBtn" type="button">登入</button>
        </div>
      </div>

      <div id="loggedInView" style="display:none;">
        <div style="font-weight:800; margin-bottom:6px;">
          已登入：<span id="currentStaffName">—</span>
        </div>
        <div class="muted" style="font-weight:800; margin-bottom:10px;">
          <span id="currentStaffEmail">—</span>
        </div>
        <div class="actions" style="justify-content:flex-end;">
          <button class="btn-secondary" id="logoutBtn" type="button">登出</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar-row">
        <div class="panel-title" style="margin-bottom:0;">跟進篩選</div>
        <div class="actions">
          <button class="btn-success" id="openCreateFollowupBtn" type="button">新增跟進個案</button>
          <button class="btn-secondary" id="refreshBtn" type="button">重新整理</button>
        </div>
      </div>

      <div class="grid-6">
        <div class="form-row">
          <label for="searchPatientId">CUMC 號碼</label>
          <input id="searchPatientId" type="text" placeholder="例如：CUMC123456" />
        </div>

        <div class="form-row">
          <label for="searchStatus">狀態</label>
          <select id="searchStatus">
            <option value="all">全部狀態</option>
            <option value="open">open</option>
            <option value="in_progress">in_progress</option>
            <option value="pending">pending</option>
            <option value="completed">completed</option>
            <option value="cancelled">cancelled</option>
          </select>
        </div>

        <div class="form-row">
          <label for="searchPriority">優先級</label>
          <select id="searchPriority">
            <option value="all">全部優先級</option>
            <option value="low">low</option>
            <option value="normal">normal</option>
            <option value="high">high</option>
            <option value="urgent">urgent</option>
          </select>
        </div>

        <div class="form-row">
          <label for="searchCategory">類型</label>
          <select id="searchCategory">
            <option value="all">全部類型</option>
            <option value="insurance_form">insurance_form</option>
            <option value="abnormal_result">abnormal_result</option>
            <option value="callback">callback</option>
            <option value="document_request">document_request</option>
            <option value="return_visit">return_visit</option>
            <option value="admin">admin</option>
            <option value="other">other</option>
          </select>
        </div>

        <div class="form-row">
          <label for="searchAssignedTo">指派人</label>
          <input id="searchAssignedTo" type="text" placeholder="輸入 staff email / name / code" />
        </div>

        <div class="form-row">
          <label for="searchSource">來源</label>
          <select id="searchSource">
            <option value="all">全部來源</option>
            <option value="phone">phone</option>
            <option value="counter">counter</option>
            <option value="doctor">doctor</option>
            <option value="lab">lab</option>
            <option value="system">system</option>
            <option value="email">email</option>
            <option value="admin">admin</option>
            <option value="other">other</option>
          </select>
        </div>
      </div>

      <div class="grid-4" style="margin-top:12px;">
        <div class="form-row">
          <label for="searchOnlyActive">只看未完成</label>
          <select id="searchOnlyActive">
            <option value="true" selected>是</option>
            <option value="false">否</option>
          </select>
        </div>

        <div class="form-row">
          <label for="searchOnlyMine">只看我的待辦</label>
          <select id="searchOnlyMine">
            <option value="false" selected>否</option>
            <option value="true">是</option>
          </select>
        </div>

        <div class="form-row">
          <label for="searchOverdueOnly">只看逾期</label>
          <select id="searchOverdueOnly">
            <option value="false" selected>否</option>
            <option value="true">是</option>
          </select>
        </div>

        <div class="actions" style="align-items:flex-end;">
          <button class="btn-primary" id="searchBtn" type="button">搜尋</button>
          <button class="btn-secondary" id="clearSearchBtn" type="button">清除條件</button>
        </div>
      </div>

      <div class="search-help-note">
        列表頁只讀取 `followups`；按「查看詳情」時，才會讀取 `followup_events + followup_comments` 並合併為 timeline。
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">工作台摘要</div>
      <div class="summary-row" id="summaryRow"></div>
    </div>

    <div class="panel">
      <div class="toolbar-row">
        <div class="panel-title" style="margin-bottom:0;">跟進個案列表</div>
        <div class="muted" id="listUpdatedAtText" style="font-weight:800;">—</div>
      </div>

      <div id="followupResultSummary" class="result-summary">—</div>
      <div id="followupTableWrap"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const HKT_TIMEZONE = "Asia/Hong_Kong";
    const POLLING_MS = 5000;

    const authState = {
      user: null,
      profile: null
    };

    const state = {
      followups: [],
      selectedFollowup: null,
      selectedEncounter: null,
      selectedEvents: [],
      selectedComments: [],
      lastListRenderKey: "",
      lastDetailRenderKey: "",
      filters: {
        patientId: "",
        status: "all",
        priority: "all",
        category: "all",
        assignedTo: "",
        source: "all",
        onlyActive: true,
        onlyMine: false,
        overdueOnly: false
      }
    };

    let liveRefreshTimer = null;

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function notify(message, type = "info") {
      const wrap = document.getElementById("toastWrap");
      const el = document.createElement("div");
      el.className = "toast " + type;
      el.textContent = message;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }

    function formatSupabaseError(error) {
      if (!error) return "unknown error";
      if (typeof error === "string") return error;
      const parts = [];
      if (error.message) parts.push(`message: ${error.message}`);
      if (error.code) parts.push(`code: ${error.code}`);
      if (error.details) parts.push(`details: ${error.details}`);
      if (error.hint) parts.push(`hint: ${error.hint}`);
      return parts.join(" | ") || JSON.stringify(error);
    }

    function formatDateTime(iso) {
      if (!iso) return "—";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "—";
      return new Intl.DateTimeFormat("zh-HK", {
        timeZone: HKT_TIMEZONE,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hourCycle: "h23"
      }).format(date);
    }

    function toIsoFromDatetimeLocal(value) {
      if (!value) return null;
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return null;
      return d.toISOString();
    }

    function toDatetimeLocalValue(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return "";
      const pad = n => String(n).padStart(2, "0");
      const year = d.getFullYear();
      const month = pad(d.getMonth() + 1);
      const day = pad(d.getDate());
      const hour = pad(d.getHours());
      const minute = pad(d.getMinutes());
      return `${year}-${month}-${day}T${hour}:${minute}`;
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function getCurrentStaffIdentityText() {
      return (
        authState.profile?.display_name ||
        authState.profile?.email ||
        authState.user?.email ||
        "Unknown Staff"
      );
    }

    function updateAuthUi() {
      const loggedOutView = document.getElementById("loggedOutView");
      const loggedInView = document.getElementById("loggedInView");
      const currentStaffName = document.getElementById("currentStaffName");
      const currentStaffEmail = document.getElementById("currentStaffEmail");

      const isLoggedIn = !!authState.user;

      loggedOutView.style.display = isLoggedIn ? "none" : "block";
      loggedInView.style.display = isLoggedIn ? "block" : "none";

      currentStaffName.textContent = isLoggedIn
        ? (authState.profile?.display_name || "未設定名稱")
        : "—";

      currentStaffEmail.textContent = isLoggedIn
        ? (authState.profile?.email || authState.user?.email || "—")
        : "—";
    }

    async function loadCurrentStaffProfile() {
      const { data: userData, error: userError } = await sb.auth.getUser();

      if (userError) {
        console.error("getUser failed:", userError);
        authState.user = null;
        authState.profile = null;
        updateAuthUi();
        return;
      }

      const user = userData?.user || null;
      authState.user = user;

      if (!user) {
        authState.profile = null;
        updateAuthUi();
        return;
      }

      const { data: profile, error: profileError } = await sb
        .from("staff_profiles")
        .select("id, email, display_name, role, is_active")
        .eq("id", user.id)
        .single();

      if (profileError) {
        console.error("load staff profile failed:", profileError);
        authState.profile = null;
        updateAuthUi();
        notify("已登入，但讀取 staff profile 失敗", "warning");
        return;
      }

      authState.profile = profile;
      updateAuthUi();
    }

    async function loginStaff() {
      const email = String(document.getElementById("loginEmail")?.value || "").trim();
      const password = String(document.getElementById("loginPassword")?.value || "");

      if (!email || !password) {
        notify("請輸入 email 同 password", "warning");
        return;
      }

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        notify("登入失敗\n" + formatSupabaseError(error), "error");
        return;
      }

      await loadCurrentStaffProfile();
      document.getElementById("loginPassword").value = "";
      notify("登入成功", "success");
      await refreshAll(false);
    }

    async function logoutStaff() {
      const { error } = await sb.auth.signOut();

      if (error) {
        notify("登出失敗\n" + formatSupabaseError(error), "error");
        return;
      }

      authState.user = null;
      authState.profile = null;
      updateAuthUi();
      notify("已登出", "info");
      state.followups = [];
      state.selectedFollowup = null;
      renderSummary();
      renderFollowupTable();
    }

    function requireStaffLogin() {
      if (!authState.user || !authState.profile) {
        notify("請先以職員帳戶登入", "warning");
        return false;
      }

      if (authState.profile.is_active === false) {
        notify("此職員帳戶已停用", "error");
        return false;
      }

      return true;
    }

    function withButtonLoading(button, fn) {
      if (!button) return fn();
      const oldDisabled = button.disabled;
      button.disabled = true;
      button.style.opacity = "0.65";
      button.style.pointerEvents = "none";

      return Promise.resolve()
        .then(fn)
        .finally(() => {
          button.disabled = oldDisabled;
          button.style.opacity = "";
          button.style.pointerEvents = "";
        });
    }

    function getStatusPillClass(status) {
      return `pill pill-status-${status || "open"}`;
    }

    function getPriorityPillClass(priority) {
      return `pill pill-priority-${priority || "normal"}`;
    }

    function getCategoryLabel(category) {
      const map = {
        insurance_form: "Insurance Form",
        abnormal_result: "Abnormal Result",
        callback: "Callback",
        document_request: "Document Request",
        return_visit: "Return Visit",
        admin: "Admin",
        other: "Other"
      };
      return map[category] || category || "—";
    }

    function getStatusLabel(status) {
      return status || "—";
    }

    function isFollowupActive(item) {
      return !["completed", "cancelled"].includes(item.status);
    }

    function isOverdue(item) {
      if (!item?.due_at) return false;
      if (!isFollowupActive(item)) return false;
      const due = new Date(item.due_at).getTime();
      if (Number.isNaN(due)) return false;
      return due < Date.now();
    }

    function getCurrentStaffMatchValues() {
      const values = [
        authState.profile?.email,
        authState.profile?.display_name,
        authState.user?.email
      ].filter(Boolean).map(v => String(v).trim().toLowerCase());
      return Array.from(new Set(values));
    }

    function readFiltersFromUi() {
      state.filters = {
        patientId: String(document.getElementById("searchPatientId").value || "").trim().toUpperCase(),
        status: String(document.getElementById("searchStatus").value || "all"),
        priority: String(document.getElementById("searchPriority").value || "all"),
        category: String(document.getElementById("searchCategory").value || "all"),
        assignedTo: String(document.getElementById("searchAssignedTo").value || "").trim().toLowerCase(),
        source: String(document.getElementById("searchSource").value || "all"),
        onlyActive: String(document.getElementById("searchOnlyActive").value || "true") === "true",
        onlyMine: String(document.getElementById("searchOnlyMine").value || "false") === "true",
        overdueOnly: String(document.getElementById("searchOverdueOnly").value || "false") === "true"
      };
    }

    function applyFilters(items) {
      const filters = state.filters;
      const myValues = getCurrentStaffMatchValues();

      return [...items].filter(item => {
        const patientId = String(item.patient_id || "").toUpperCase();
        const assignedTo = String(item.assigned_to || "").trim().toLowerCase();
        const source = String(item.source || "").trim();

        if (filters.patientId && !patientId.includes(filters.patientId)) return false;
        if (filters.status !== "all" && item.status !== filters.status) return false;
        if (filters.priority !== "all" && item.priority !== filters.priority) return false;
        if (filters.category !== "all" && item.category !== filters.category) return false;
        if (filters.source !== "all" && source !== filters.source) return false;
        if (filters.assignedTo && !assignedTo.includes(filters.assignedTo)) return false;
        if (filters.onlyActive && !isFollowupActive(item)) return false;
        if (filters.overdueOnly && !isOverdue(item)) return false;

        if (filters.onlyMine) {
          if (!assignedTo) return false;
          const mine = myValues.some(v => v && assignedTo === v);
          if (!mine) return false;
        }

        return true;
      }).sort((a, b) => {
        const aOverdue = isOverdue(a) ? 1 : 0;
        const bOverdue = isOverdue(b) ? 1 : 0;
        if (aOverdue !== bOverdue) return bOverdue - aOverdue;

        const aDue = a.due_at ? new Date(a.due_at).getTime() : Number.MAX_SAFE_INTEGER;
        const bDue = b.due_at ? new Date(b.due_at).getTime() : Number.MAX_SAFE_INTEGER;
        if (aDue !== bDue) return aDue - bDue;

        const aCreated = new Date(a.created_at || 0).getTime();
        const bCreated = new Date(b.created_at || 0).getTime();
        return bCreated - aCreated;
      });
    }

    async function loadFollowups() {
      const { data, error } = await sb
        .from("followups")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) throw error;
      state.followups = data || [];
    }

    function renderSummary() {
      const el = document.getElementById("summaryRow");
      const items = state.followups || [];

      const total = items.length;
      const active = items.filter(isFollowupActive).length;
      const overdue = items.filter(isOverdue).length;
      const completed = items.filter(x => x.status === "completed").length;

      const myValues = getCurrentStaffMatchValues();
      const mine = items.filter(item => {
        const assignedTo = String(item.assigned_to || "").trim().toLowerCase();
        return assignedTo && myValues.some(v => assignedTo === v);
      }).length;

      el.innerHTML = `
        <div class="summary-card">
          <div class="summary-label">全部個案</div>
          <div class="summary-value">${total}</div>
          <div class="summary-sub">All followups</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">未完成</div>
          <div class="summary-value">${active}</div>
          <div class="summary-sub">open / in_progress / pending</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">逾期</div>
          <div class="summary-value ${overdue ? "danger-text" : ""}">${overdue}</div>
          <div class="summary-sub">due_at 已過且未完成</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">已完成</div>
          <div class="summary-value">${completed}</div>
          <div class="summary-sub">completed</div>
        </div>
        <div class="summary-card">
          <div class="summary-label">我的個案</div>
          <div class="summary-value">${mine}</div>
          <div class="summary-sub">assigned_to = current staff</div>
        </div>
      `;
    }

    function renderFollowupTable() {
      const wrap = document.getElementById("followupTableWrap");
      const summary = document.getElementById("followupResultSummary");
      const updatedAt = document.getElementById("listUpdatedAtText");

      const filtered = applyFilters(state.followups);
      summary.textContent = `共找到 ${filtered.length} 項結果。`;
      updatedAt.textContent = `最後更新：${formatDateTime(nowIso())}`;

      if (!filtered.length) {
        const html = `<div class="empty-box">暫無符合條件的跟進個案</div>`;
        if (state.lastListRenderKey !== html) {
          wrap.innerHTML = html;
          state.lastListRenderKey = html;
        }
        return;
      }

      const html = `
        <table>
          <thead>
            <tr>
              <th style="width:140px;">Follow-up No</th>
              <th style="width:120px;">CUMC</th>
              <th>標題 / 摘要</th>
              <th style="width:170px;">狀態 / 優先級</th>
              <th style="width:160px;">指派人</th>
              <th style="width:170px;">到期日</th>
              <th style="width:150px;">建立時間</th>
              <th style="width:120px;">操作</th>
            </tr>
          </thead>
          <tbody>
            ${filtered.map(item => `
              <tr>
                <td>
                  <div class="followup-meta-stack">
                    <div style="font-weight:900;color:#0f172a;">${escapeHtml(item.followup_no || "—")}</div>
                    <div class="followup-sub">${escapeHtml(getCategoryLabel(item.category))}</div>
                  </div>
                </td>
                <td>
                  <div style="font-weight:900;color:#0f172a;">${escapeHtml(item.patient_id || "—")}</div>
                  <div class="followup-sub">Encounter: ${escapeHtml(item.encounter_id || "—")}</div>
                </td>
                <td>
                  <div class="followup-title">${escapeHtml(item.title || "—")}</div>
                  <div class="followup-sub">${escapeHtml(item.description || "—")}</div>
                  <div class="badge-row" style="margin-top:8px;">
                    <span class="pill pill-category">${escapeHtml(getCategoryLabel(item.category))}</span>
                    ${item.source ? `<span class="pill pill-source">${escapeHtml(item.source)}</span>` : ""}
                    ${item.requested_by ? `<span class="pill pill-requested">${escapeHtml(item.requested_by)}</span>` : ""}
                  </div>
                </td>
                <td>
                  <div class="badge-row">
                    <span class="${getStatusPillClass(item.status)}">${escapeHtml(getStatusLabel(item.status))}</span>
                    <span class="${getPriorityPillClass(item.priority)}">${escapeHtml(item.priority || "normal")}</span>
                  </div>
                  ${isOverdue(item) ? `<div class="followup-sub" style="margin-top:8px;color:#b91c1c;font-weight:900;">⚠ 已逾期</div>` : ""}
                </td>
                <td>
                  <div style="font-weight:900;color:#0f172a;">${escapeHtml(item.assigned_to || "—")}</div>
                  <div class="followup-sub">Created by: ${escapeHtml(item.created_by || "—")}</div>
                </td>
                <td>
                  <div style="font-weight:900;color:#0f172a;">${escapeHtml(formatDateTime(item.due_at))}</div>
                  <div class="followup-sub">Closed: ${escapeHtml(formatDateTime(item.closed_at))}</div>
                </td>
                <td>
                  <div style="font-weight:900;color:#0f172a;">${escapeHtml(formatDateTime(item.created_at))}</div>
                  <div class="followup-sub">Updated: ${escapeHtml(formatDateTime(item.updated_at))}</div>
                </td>
                <td>
                  <div class="actions">
                    <button class="btn-primary btn-small" type="button" onclick="window.viewFollowupDetail('${item.id}')">查看詳情</button>
                  </div>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;

      if (state.lastListRenderKey !== html) {
        wrap.innerHTML = html;
        state.lastListRenderKey = html;
      }
    }

    function clearSearchFilters() {
      document.getElementById("searchPatientId").value = "";
      document.getElementById("searchStatus").value = "all";
      document.getElementById("searchPriority").value = "all";
      document.getElementById("searchCategory").value = "all";
      document.getElementById("searchAssignedTo").value = "";
      document.getElementById("searchSource").value = "all";
      document.getElementById("searchOnlyActive").value = "true";
      document.getElementById("searchOnlyMine").value = "false";
      document.getElementById("searchOverdueOnly").value = "false";

      readFiltersFromUi();
      renderFollowupTable();
      notify("已清除搜尋條件", "info");
    }

    function openCreateFollowupModal(prefill = {}) {
      document.getElementById("createPatientId").value = prefill.patient_id || "";
      document.getElementById("createEncounterId").value = prefill.encounter_id || "";
      document.getElementById("createCategory").value = prefill.category || "insurance_form";
      document.getElementById("createTitle").value = prefill.title || "";
      document.getElementById("createStatus").value = prefill.status || "open";
      document.getElementById("createPriority").value = prefill.priority || "normal";
      document.getElementById("createAssignedTo").value = prefill.assigned_to || (authState.profile?.email || authState.profile?.display_name || "");
      document.getElementById("createDueAt").value = prefill.due_at || "";
      document.getElementById("createSource").value = prefill.source || "";
      document.getElementById("createRequestedBy").value = prefill.requested_by || "";
      document.getElementById("createDescription").value = prefill.description || "";

      const modal = document.getElementById("createFollowupModal");
      modal.classList.add("show");
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
    }

    function closeCreateFollowupModal() {
      const modal = document.getElementById("createFollowupModal");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
    }

    function closeFollowupDetailModal() {
      const modal = document.getElementById("followupDetailModal");
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      state.selectedFollowup = null;
      state.selectedEncounter = null;
      state.selectedEvents = [];
      state.selectedComments = [];
      state.lastDetailRenderKey = "";
    }

    function eventLabelFromType(eventType, eventData) {
      const data = eventData || {};
      if (eventType === "created") return "Follow-up created";
      if (eventType === "assigned") return data?.to ? `Assigned to ${data.to}` : "Assigned";
      if (eventType === "unassigned") return "Unassigned";
      if (eventType === "status_changed") return `Status changed: ${data?.from || "—"} → ${data?.to || "—"}`;
      if (eventType === "priority_changed") return `Priority changed: ${data?.from || "—"} → ${data?.to || "—"}`;
      if (eventType === "due_date_changed") return "Due date updated";
      if (eventType === "completed") return "Marked as completed";
      if (eventType === "cancelled") return "Marked as cancelled";
      if (eventType === "reopened") return "Reopened";
      return "Event updated";
    }

    function formatEventBody(event) {
      const data = event.event_data || {};
      if (event.event_type === "created") {
        const parts = [];
        if (data.status) parts.push(`Status: ${data.status}`);
        if (data.priority) parts.push(`Priority: ${data.priority}`);
        if (data.assigned_to) parts.push(`Assigned to: ${data.assigned_to}`);
        return parts.join("｜") || "已建立跟進個案";
      }

      if (event.event_type === "assigned") {
        return `From: ${data.from || "—"}｜To: ${data.to || "—"}`;
      }

      if (event.event_type === "unassigned") {
        return `From: ${data.from || "—"}｜To: —`;
      }

      if (event.event_type === "status_changed" || event.event_type === "priority_changed") {
        return `From: ${data.from || "—"}｜To: ${data.to || "—"}`;
      }

      if (event.event_type === "due_date_changed") {
        return `From: ${formatDateTime(data.from)}｜To: ${formatDateTime(data.to)}`;
      }

      if (event.event_type === "completed" || event.event_type === "cancelled" || event.event_type === "reopened") {
        return data.outcome ? `Outcome: ${data.outcome}` : "";
      }

      return "";
    }

    function buildMergedTimeline() {
      const eventItems = (state.selectedEvents || []).map(event => ({
        item_type: "event",
        id: event.id,
        created_at: event.created_at,
        actor: event.actor,
        title: event.event_label || eventLabelFromType(event.event_type, event.event_data),
        body: formatEventBody(event)
      }));

      const commentItems = (state.selectedComments || []).map(comment => ({
        item_type: "comment",
        id: comment.id,
        created_at: comment.created_at,
        actor: comment.created_by,
        title: "Comment added",
        body: comment.comment_text || ""
      }));

      return [...eventItems, ...commentItems].sort((a, b) => {
        const aTime = new Date(a.created_at || 0).getTime();
        const bTime = new Date(b.created_at || 0).getTime();
        return bTime - aTime;
      });
    }

    async function viewFollowupDetail(id) {
      if (!requireStaffLogin()) return;

      try {
        const { data: followup, error: followupError } = await sb
          .from("followups")
          .select("*")
          .eq("id", id)
          .single();

        if (followupError) throw followupError;

        state.selectedFollowup = followup;

        const [eventsRes, commentsRes, encounterRes] = await Promise.all([
          sb.from("followup_events").select("*").eq("followup_id", id).order("created_at", { ascending: false }),
          sb.from("followup_comments").select("*").eq("followup_id", id).order("created_at", { ascending: false }),
          followup.encounter_id
            ? sb.from("encounters").select("*").eq("id", followup.encounter_id).single()
            : Promise.resolve({ data: null, error: null })
        ]);

        if (eventsRes.error) throw eventsRes.error;
        if (commentsRes.error) throw commentsRes.error;
        if (encounterRes.error) throw encounterRes.error;

        state.selectedEvents = eventsRes.data || [];
        state.selectedComments = commentsRes.data || [];
        state.selectedEncounter = encounterRes.data || null;

        const modal = document.getElementById("followupDetailModal");
        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
        document.body.classList.add("modal-open");
        renderDetailModal();
      } catch (error) {
        console.error(error);
        notify("讀取個案詳情失敗\n" + formatSupabaseError(error), "error");
      }
    }

    window.viewFollowupDetail = viewFollowupDetail;

    async function createFollowupCase() {
      if (!requireStaffLogin()) return;

      const patientId = String(document.getElementById("createPatientId").value || "").trim().toUpperCase();
      const encounterIdRaw = String(document.getElementById("createEncounterId").value || "").trim();
      const category = document.getElementById("createCategory").value;
      const title = String(document.getElementById("createTitle").value || "").trim();
      const status = document.getElementById("createStatus").value;
      const priority = document.getElementById("createPriority").value;
      const assignedTo = String(document.getElementById("createAssignedTo").value || "").trim();
      const dueAt = toIsoFromDatetimeLocal(document.getElementById("createDueAt").value);
      const source = document.getElementById("createSource").value || null;
      const requestedBy = document.getElementById("createRequestedBy").value || null;
      const description = String(document.getElementById("createDescription").value || "").trim();

      if (!patientId || !title) {
        notify("請填寫病人 CUMC 號碼及標題", "warning");
        return;
      }

      const createdBy = getCurrentStaffIdentityText();

      try {
        const payload = {
          patient_id: patientId,
          encounter_id: encounterIdRaw || null,
          category,
          title,
          description: description || null,
          status,
          priority,
          assigned_to: assignedTo || null,
          created_by: createdBy,
          due_at: dueAt,
          source,
          requested_by: requestedBy,
          outcome: null
        };

        const { data: created, error: createError } = await sb
          .from("followups")
          .insert(payload)
          .select("*")
          .single();

        if (createError) throw createError;

        const eventPayload = {
          followup_id: created.id,
          event_type: "created",
          event_label: "Follow-up created",
          event_data: {
            status: created.status,
            priority: created.priority,
            assigned_to: created.assigned_to
          },
          actor: createdBy
        };

        const { error: eventError } = await sb
          .from("followup_events")
          .insert(eventPayload);

        if (eventError) throw eventError;

        notify(`已建立跟進個案：${created.followup_no || created.id}`, "success");
        closeCreateFollowupModal();
        await refreshAll(false);
      } catch (error) {
        console.error(error);
        notify("建立跟進個案失敗\n" + formatSupabaseError(error), "error");
      }
    }

    async function saveFollowupDetailUpdates() {
      if (!requireStaffLogin()) return;
      const item = state.selectedFollowup;
      if (!item) return;

      const nextStatus = document.getElementById("detailStatus").value;
      const nextPriority = document.getElementById("detailPriority").value;
      const nextAssignedTo = String(document.getElementById("detailAssignedTo").value || "").trim() || null;
      const nextDueAt = toIsoFromDatetimeLocal(document.getElementById("detailDueAt").value);
      const nextOutcome = String(document.getElementById("detailOutcome").value || "").trim() || null;
      const actor = getCurrentStaffIdentityText();

      const oldStatus = item.status;
      const oldPriority = item.priority;
      const oldAssignedTo = item.assigned_to || null;
      const oldDueAt = item.due_at || null;
      const oldOutcome = item.outcome || null;

      const updatePayload = {};
      const eventsToInsert = [];

      if (nextStatus !== oldStatus) {
        updatePayload.status = nextStatus;
        eventsToInsert.push({
          followup_id: item.id,
          event_type:
            nextStatus === "completed"
              ? "completed"
              : nextStatus === "cancelled"
                ? "cancelled"
                : oldStatus === "completed" || oldStatus === "cancelled"
                  ? "reopened"
                  : "status_changed",
          event_label:
            nextStatus === "completed"
              ? "Marked as completed"
              : nextStatus === "cancelled"
                ? "Marked as cancelled"
                : oldStatus === "completed" || oldStatus === "cancelled"
                  ? "Reopened"
                  : "Status changed",
          event_data:
            nextStatus === "completed" || nextStatus === "cancelled"
              ? { from: oldStatus, to: nextStatus, outcome: nextOutcome }
              : oldStatus === "completed" || oldStatus === "cancelled"
                ? { from: oldStatus, to: nextStatus }
                : { from: oldStatus, to: nextStatus },
          actor
        });
      }

      if (nextPriority !== oldPriority) {
        updatePayload.priority = nextPriority;
        eventsToInsert.push({
          followup_id: item.id,
          event_type: "priority_changed",
          event_label: "Priority changed",
          event_data: { from: oldPriority, to: nextPriority },
          actor
        });
      }

      if (nextAssignedTo !== oldAssignedTo) {
        updatePayload.assigned_to = nextAssignedTo;
        eventsToInsert.push({
          followup_id: item.id,
          event_type: nextAssignedTo ? "assigned" : "unassigned",
          event_label: nextAssignedTo ? `Assigned to ${nextAssignedTo}` : "Unassigned",
          event_data: { from: oldAssignedTo, to: nextAssignedTo },
          actor
        });
      }

      const oldDueTime = oldDueAt ? new Date(oldDueAt).getTime() : null;
      const nextDueTime = nextDueAt ? new Date(nextDueAt).getTime() : null;
      const dueChanged = oldDueTime !== nextDueTime;

      if (dueChanged) {
        updatePayload.due_at = nextDueAt;
        eventsToInsert.push({
          followup_id: item.id,
          event_type: "due_date_changed",
          event_label: "Due date updated",
          event_data: { from: oldDueAt, to: nextDueAt },
          actor
        });
      }

      if (nextOutcome !== oldOutcome) {
        updatePayload.outcome = nextOutcome;
      }

      if (!Object.keys(updatePayload).length) {
        notify("沒有變更需要儲存", "info");
        return;
      }

      try {
        const { data: updated, error: updateError } = await sb
          .from("followups")
          .update(updatePayload)
          .eq("id", item.id)
          .select("*")
          .single();

        if (updateError) throw updateError;

        if (eventsToInsert.length) {
          const { error: eventsError } = await sb
            .from("followup_events")
            .insert(eventsToInsert);

          if (eventsError) throw eventsError;
        }

        notify("已更新個案", "success");
        await viewFollowupDetail(item.id);
        await refreshAll(false);
      } catch (error) {
        console.error(error);
        notify("更新個案失敗\n" + formatSupabaseError(error), "error");
      }
    }

    async function addFollowupComment() {
      if (!requireStaffLogin()) return;
      const item = state.selectedFollowup;
      if (!item) return;

      const commentText = String(document.getElementById("detailCommentText").value || "").trim();
      const isInternal = document.getElementById("detailCommentInternal").value === "true";
      const createdBy = getCurrentStaffIdentityText();

      if (!commentText) {
        notify("請輸入 comment", "warning");
        return;
      }

      try {
        const { error: commentError } = await sb
          .from("followup_comments")
          .insert({
            followup_id: item.id,
            comment_text: commentText,
            is_internal: isInternal,
            created_by: createdBy
          });

        if (commentError) throw commentError;

        const { error: updateError } = await sb
          .from("followups")
          .update({ updated_at: nowIso() })
          .eq("id", item.id);

        if (updateError) throw updateError;

        notify("已新增 comment", "success");
        await viewFollowupDetail(item.id);
        await refreshAll(false);
      } catch (error) {
        console.error(error);
        notify("新增 comment 失敗\n" + formatSupabaseError(error), "error");
      }
    }

    async function refreshAll(showToast = false) {
      if (!requireStaffLogin()) {
        state.followups = [];
        renderSummary();
        renderFollowupTable();
        return;
      }

      try {
        await loadFollowups();
        renderSummary();
        renderFollowupTable();

        if (showToast) notify("已重新整理", "info");
      } catch (error) {
        console.error(error);
        notify("讀取 followups 失敗\n" + formatSupabaseError(error), "error");
      }
    }

    function parseQueryPrefill() {
      const params = new URLSearchParams(window.location.search);
      const patient_id = String(params.get("patient_id") || "").trim().toUpperCase();
      const encounter_id = String(params.get("encounter_id") || "").trim();
      if (!patient_id && !encounter_id) return null;
      return { patient_id, encounter_id };
    }

    function startPolling() {
      if (liveRefreshTimer) clearInterval(liveRefreshTimer);
      liveRefreshTimer = setInterval(async () => {
        if (!authState.user || !authState.profile) return;
        await refreshAll(false);
      }, POLLING_MS);
    }

    async function initApp() {
      await loadCurrentStaffProfile();
      readFiltersFromUi();
      renderSummary();
      renderFollowupTable();
      if (authState.user && authState.profile) {
        await refreshAll(false);
      }
      startPolling();

      const prefill = parseQueryPrefill();
      if (prefill && authState.user && authState.profile) {
        openCreateFollowupModal(prefill);
      }
    }

    document.getElementById("loginBtn").addEventListener("click", (e) => {
      withButtonLoading(e.currentTarget, loginStaff);
    });

    document.getElementById("logoutBtn").addEventListener("click", (e) => {
      withButtonLoading(e.currentTarget, logoutStaff);
    });

    document.getElementById("loginPassword").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();

        withButtonLoading(btn, loginStaff);

    document.getElementById("openCreateFollowupBtn").addEventListener("click", () => {
      if (!requireStaffLogin()) return;
      openCreateFollowupModal();

    document.getElementById("closeCreateFollowupModalBtn").addEventListener("click", closeCreateFollowupModal);
    document.getElementById("cancelCreateFollowupBtn").addEventListener("click", closeCreateFollowupModal);

    document.getElementById("saveCreateFollowupBtn").addEventListener("click", (e) => {
      withButtonLoading(e.currentTarget, createFollowupCase);
    });

    document.getElementById("closeFollowupDetailModalBtn").addEventListener("click", closeFollowupDetailModal);

    document.getElementById("createFollowupModal").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeCreateFollowupModal();
    });

    document.getElementById("followupDetailModal").addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeFollowupDetailModal();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeCreateFollowupModal();
        closeFollowupDetailModal();
      }
    });

    document.getElementById("searchBtn").addEventListener("click", () => {
      readFiltersFromUi();
      renderFollowupTable();
    });

    document.getElementById("clearSearchBtn").addEventListener("click", clearSearchFilters);

    document.getElementById("refreshBtn").addEventListener("click", (e) => {
      withButtonLoading(e.currentTarget, () => refreshAll(true));
    });

    [
      "searchPatientId",
      "searchAssignedTo"
    ].forEach(id => {
      document.getElementById(id).addEventListener("input", (event) => {
        if (id === "searchPatientId") event.target.value = event.target.value.toUpperCase();
      });

      document.getElementById(id).addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          readFiltersFromUi();
          renderFollowupTable();
        }
      });
    });

    [
      "searchStatus",
      "searchPriority",
      "searchCategory",
      "searchSource",
      "searchOnlyActive",
      "searchOnlyMine",
      "searchOverdueOnly"
    ].forEach(id => {
      document.getElementById(id).addEventListener("change", () => {
        readFiltersFromUi();
        renderFollowupTable();
      });
    });

    initApp();

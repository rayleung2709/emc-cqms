<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>留言進度列表</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .wrap {
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      overflow: hidden;
    }

    .card-head {
      padding: 18px 20px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .card-head h1 {
      margin: 0;
      font-size: 22px;
    }

    .card-body {
      padding: 20px;
    }

    .composer {
      display: grid;
      gap: 10px;
      margin-bottom: 22px;
    }

    .input,
    .textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #fff;
    }

    .input:focus,
    .textarea:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .textarea {
      min-height: 110px;
      resize: vertical;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.05s ease, opacity 0.15s ease, background 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-secondary:hover {
      background: #d1d5db;
    }

    .btn-small {
      border: 0;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #e0e7ff;
      color: #1d4ed8;
      white-space: nowrap;
    }

    .btn-small:hover {
      background: #c7d2fe;
    }

    .hint {
      font-size: 12px;
      color: #6b7280;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .progress-item {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px 16px;
      background: #fafafa;
    }

    .progress-head {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .progress-main {
      flex: 1;
      min-width: 240px;
    }

    .progress-author {
      font-size: 13px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 4px;
    }

    .progress-content {
      font-size: 14px;
      line-height: 1.7;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .progress-right {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 130px;
    }

    .progress-time {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
    }

    .progress-actions {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
      margin-top: 0;
      justify-content: flex-end;
    }

    .locked-text {
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
    }

    .empty {
      border: 1px dashed #d1d5db;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: #6b7280;
      background: #fff;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(17, 24, 39, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
      overflow: hidden;
    }

    .modal-head {
      padding: 16px 18px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 18px;
      font-weight: 700;
    }

    .modal-body {
      padding: 18px;
      display: grid;
      gap: 10px;
    }

    .modal-foot {
      padding: 16px 18px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      body {
        padding: 16px;
      }

      .card-body {
        padding: 16px;
      }

      .progress-right {
        min-width: unset;
        width: 100%;
        align-items: center;
        justify-content: flex-start;
        flex-wrap: wrap;
      }

      .progress-actions {
        justify-content: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="card-head">
        <h1>留言進度列表</h1>
        <div class="hint">留言送出後 15 分鐘內可編輯，之後鎖定；不可刪除。</div>
      </div>

      <div class="card-body">
        <div class="composer">
          <input id="authorInput" class="input" type="text" placeholder="輸入姓名，例如：陳小明" />
          <textarea id="contentInput" class="textarea" placeholder="輸入留言內容..."></textarea>
          <div class="actions">
            <button id="addBtn" class="btn btn-primary" type="button">新增留言</button>
          </div>
        </div>

        <div id="list" class="list"></div>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
      <div id="editTitle" class="modal-head">編輯留言</div>
      <div class="modal-body">
        <div class="hint">只可於留言建立後 15 分鐘內編輯。</div>
        <textarea id="editContentInput" class="textarea" placeholder="修改留言內容..."></textarea>
      </div>
      <div class="modal-foot">
        <button id="cancelEditBtn" class="btn btn-secondary" type="button">取消</button>
        <button id="saveEditBtn" class="btn btn-primary" type="button">儲存修改</button>
      </div>
    </div>
  </div>

  <script>
    const EDIT_LIMIT_MS = 15 * 60 * 1000;

    let progressList = [
      {
        id: "p1",
        author: "王小美",
        content: "已聯絡客戶，等待回覆中。",
        createdAt: new Date(Date.now() - 5 * 60 * 1000).toISOString()
      },
      {
        id: "p2",
        author: "陳大文",
        content: "零件已到貨，預計今天下午安排測試。",
        createdAt: new Date(Date.now() - 25 * 60 * 1000).toISOString()
      }
    ];

    let editingId = null;

    const authorInput = document.getElementById("authorInput");
    const contentInput = document.getElementById("contentInput");
    const addBtn = document.getElementById("addBtn");
    const listEl = document.getElementById("list");

    const editModal = document.getElementById("editModal");
    const editContentInput = document.getElementById("editContentInput");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const saveEditBtn = document.getElementById("saveEditBtn");

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateTime(value) {
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "";
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      const ss = String(d.getSeconds()).padStart(2, "0");
      return `${y}/${m}/${day} ${hh}:${mm}:${ss}`;
    }

    function canEditProgress(item) {
      if (!item || !item.createdAt) return false;
      const created = new Date(item.createdAt).getTime();
      if (Number.isNaN(created)) return false;
      return Date.now() - created <= EDIT_LIMIT_MS;
    }

    function renderProgressItem(item) {
      const author = escapeHtml(item.author || "");
      const content = escapeHtml(item.content || "");
      const time = escapeHtml(formatDateTime(item.createdAt));

      return `
        <div class="progress-item">
          <div class="progress-head">
            <div class="progress-main">
              <div class="progress-author">${author}</div>
              <div class="progress-content">${content}</div>
            </div>

            <div class="progress-right">
              <span class="progress-time">${time}</span>
              ${
                canEditProgress(item)
                  ? `
                    <div class="progress-actions">
                      <button
                        type="button"
                        class="btn-small"
                        onclick="editProgress('${String(item.id).replace(/'/g, "\\'")}')"
                      >編輯</button>
                    </div>
                  `
                  : `<span class="locked-text">已鎖定</span>`
              }
            </div>
          </div>
        </div>
      `;
    }

    function renderList() {
      if (!progressList.length) {
        listEl.innerHTML = `<div class="empty">暫時未有留言</div>`;
        return;
      }

      listEl.innerHTML = progressList
        .slice()
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
        .map(renderProgressItem)
        .join("");
    }

    function addProgress() {
      const author = authorInput.value.trim();
      const content = contentInput.value.trim();

      if (!author) {
        alert("請輸入姓名。");
        authorInput.focus();
        return;
      }

      if (!content) {
        alert("請輸入留言內容。");
        contentInput.focus();
        return;
      }

      const item = {
        id: "p" + Date.now(),
        author,
        content,
        createdAt: new Date().toISOString()
      };

      progressList.push(item);
      authorInput.value = "";
      contentInput.value = "";
      renderList();
    }

    function openEditModal(item) {
      editingId = item.id;
      editContentInput.value = item.content || "";
      editModal.classList.add("show");
      editModal.setAttribute("aria-hidden", "false");
      setTimeout(() => {
        editContentInput.focus();
        editContentInput.setSelectionRange(
          editContentInput.value.length,
          editContentInput.value.length
        );
      }, 0);
    }

    function closeEditModal() {
      editingId = null;
      editContentInput.value = "";
      editModal.classList.remove("show");
      editModal.setAttribute("aria-hidden", "true");
    }

    function editProgress(id) {
      const item = progressList.find(x => String(x.id) === String(id));
      if (!item) return;

      if (!canEditProgress(item)) {
        alert("此留言已超過 15 分鐘，不能編輯。");
        renderList();
        return;
      }

      openEditModal(item);
    }

    function saveProgressEdit() {
      if (!editingId) return;

      const item = progressList.find(x => String(x.id) === String(editingId));
      if (!item) {
        closeEditModal();
        return;
      }

      if (!canEditProgress(item)) {
        alert("此留言已超過 15 分鐘，不能編輯。");
        closeEditModal();
        renderList();
        return;
      }

      const newContent = editContentInput.value.trim();
      if (!newContent) {
        alert("留言內容不能留空。");
        editContentInput.focus();
        return;
      }

      item.content = newContent;
      closeEditModal();
      renderList();
    }

    addBtn.addEventListener("click", addProgress);
    cancelEditBtn.addEventListener("click", closeEditModal);
    saveEditBtn.addEventListener("click", saveProgressEdit);

    contentInput.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        addProgress();
      }
    });

    editContentInput.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        saveProgressEdit();
      }
    });

    editModal.addEventListener("click", function (e) {
      if (e.target === editModal) {
        closeEditModal();
      }
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && editModal.classList.contains("show")) {
        closeEditModal();
      }
    });

    renderList();

    window.editProgress = editProgress;
  </script>
</body>
</html>

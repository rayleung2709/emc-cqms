<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重設密碼 - EMCQMS</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#06101f;
      --panel:#0b1528;
      --panel-2:#111c33;
      --text:#f8fafc;
      --sub:#cbd5e1;
      --line:rgba(255,255,255,0.12);
      --blue:#60a5fa;
      --blue-2:#2563eb;
      --green:#22c55e;
      --red:#ef4444;
      --yellow:#f59e0b;
      --shadow:0 18px 40px rgba(0,0,0,.32);
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:Arial,"Microsoft JhengHei","PingFang TC",sans-serif;
      background:linear-gradient(180deg,#06101f 0%,#081426 100%);
      color:var(--text);
    }

    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .page{
      width:100%;
      max-width:520px;
    }

    .card{
      background:rgba(11,21,40,.96);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .head{
      padding:22px 22px 18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background:linear-gradient(90deg,rgba(37,99,235,.24),rgba(37,99,235,.05));
    }

    .brand{
      font-size:1rem;
      font-weight:900;
      color:#bfdbfe;
      letter-spacing:.04em;
      margin-bottom:10px;
    }

    .title{
      font-size:2rem;
      font-weight:900;
      line-height:1.08;
      margin:0 0 8px;
    }

    .subtitle{
      color:var(--sub);
      font-size:1rem;
      line-height:1.6;
      font-weight:700;
    }

    .body{
      padding:22px;
    }

    .field{
      margin-bottom:16px;
    }

    .label{
      display:block;
      margin-bottom:8px;
      font-size:.96rem;
      font-weight:900;
      color:#dbeafe;
    }

    .input{
      width:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(15,23,42,.95);
      color:#fff;
      padding:14px 14px;
      font-size:1rem;
      outline:none;
      transition:.18s ease;
    }

    .input:focus{
      border-color:rgba(96,165,250,.6);
      box-shadow:0 0 0 3px rgba(96,165,250,.12);
    }

    .help{
      font-size:.92rem;
      color:var(--sub);
      line-height:1.6;
      margin-top:8px;
      font-weight:700;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }

    .btn{
      appearance:none;
      border:none;
      border-radius:14px;
      padding:13px 16px;
      cursor:pointer;
      font-size:1rem;
      font-weight:900;
      transition:.18s ease;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
    }

    .btn-primary{
      background:linear-gradient(90deg,var(--blue-2),#3b82f6);
      color:#fff;
      flex:1 1 220px;
    }

    .btn-primary:hover{filter:brightness(1.05)}

    .btn-secondary{
      background:rgba(30,41,59,.95);
      color:#fff;
      border:1px solid rgba(255,255,255,.12);
      flex:1 1 180px;
    }

    .btn-secondary:hover{
      background:rgba(51,65,85,.95);
    }

    .status{
      margin-top:18px;
      padding:14px 15px;
      border-radius:14px;
      font-size:.98rem;
      line-height:1.6;
      font-weight:800;
      display:none;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .status.show{display:block}
    .status.info{
      background:rgba(37,99,235,.14);
      border:1px solid rgba(96,165,250,.28);
      color:#dbeafe;
    }
    .status.success{
      background:rgba(34,197,94,.14);
      border:1px solid rgba(34,197,94,.28);
      color:#dcfce7;
    }
    .status.error{
      background:rgba(239,68,68,.14);
      border:1px solid rgba(239,68,68,.3);
      color:#fee2e2;
    }

    .footer{
      margin-top:16px;
      text-align:center;
      color:#93c5fd;
      font-size:.92rem;
      font-weight:800;
      line-height:1.6;
    }

    .small-links{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      justify-content:center;
      margin-top:14px;
    }

    .small-links a{
      color:#bfdbfe;
      text-decoration:none;
      font-weight:800;
      font-size:.95rem;
    }

    .small-links a:hover{
      text-decoration:underline;
    }

    @media (max-width:560px){
      body{padding:14px}
      .title{font-size:1.7rem}
      .body,.head{padding:18px}
      .actions{flex-direction:column}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="head">
        <div class="brand">EMCQMS 急症醫學中心輪候系統</div>
        <h1 class="title">重設密碼</h1>
        <div class="subtitle">
          請輸入你的 CUMC 電郵地址，系統會發送重設密碼連結到你的電郵。<br>
          Enter your CUMC email address and we will send you a password reset link.
        </div>
      </div>

      <div class="body">
        <form id="resetForm">
          <div class="field">
            <label class="label" for="email">CUMC 電郵</label>
            <input
              id="email"
              class="input"
              type="email"
              inputmode="email"
              autocomplete="email"
              placeholder="name@cumc.hk"
              required
            />
            <div class="help">
              你會收到一封電郵，點擊其中連結後會前往本網站的改密碼頁面。
            </div>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary" id="sendBtn">發送重設密碼電郵</button>
            <a class="btn btn-secondary" href="./">返回主頁</a>
          </div>
        </form>

        <div id="statusBox" class="status info"></div>

        <div class="small-links">
          <a href="./auth-callback.html">Magic Login Callback</a>
          <a href="./update-password.html">改密碼頁面</a>
        </div>
      </div>
    </div>

    <div class="footer">
      急症醫學中心<br>
      Emergency Medicine Centre
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dvyberdrmmfgutjqnpjr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2eWJlcmRybW1mZ3V0anFucGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MDc3NTMsImV4cCI6MjA5MTQ4Mzc1M30.9aRRSP2xAAozx2bxH9a1Z13tDDwot82Mb8ax5hxirck";
    const RESET_REDIRECT_URL = "https://rayleung2709.github.io/emc-cqms/update-password.html";

    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      document.body.innerHTML = '<div style="padding:24px;color:#fff;background:#06101f;font-family:Arial,sans-serif">Supabase SDK 載入失敗，請檢查網絡。</div>';
      throw new Error("Supabase SDK not loaded");
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("resetForm");
    const emailInput = document.getElementById("email");
    const sendBtn = document.getElementById("sendBtn");
    const statusBox = document.getElementById("statusBox");

    function showStatus(message, type = "info") {
      statusBox.className = `status show ${type}`;
      statusBox.textContent = message;
    }

    function setLoading(loading) {
      sendBtn.disabled = !!loading;
      sendBtn.textContent = loading ? "發送中…" : "發送重設密碼電郵";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = emailInput.value.trim();
      if (!email) {
        showStatus("請先輸入電郵地址。", "error");
        return;
      }

      setLoading(true);
      showStatus("正在發送重設密碼電郵…", "info");

      try {
        const { error } = await sb.auth.resetPasswordForEmail(email, {
          redirectTo: RESET_REDIRECT_URL
        });

        if (error) throw error;

        showStatus(
          "如果此電郵地址已註冊，你將會收到一封重設密碼電郵。\n\n請打開電郵並點擊連結，系統會帶你到改密碼頁面。",
          "success"
        );
      } catch (err) {
        console.error(err);
        showStatus(`發送失敗：${err.message || "未知錯誤"}`, "error");
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>

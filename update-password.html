<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>更新密碼 - EMCQMS</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#06101f;
      --panel:#0b1528;
      --text:#f8fafc;
      --sub:#cbd5e1;
      --line:rgba(255,255,255,0.12);
      --blue:#2563eb;
      --green:#22c55e;
      --red:#ef4444;
      --shadow:0 18px 40px rgba(0,0,0,.32);
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      padding:0;
      min-height:100%;
      font-family:Arial,"Microsoft JhengHei","PingFang TC",sans-serif;
      background:linear-gradient(180deg,#06101f 0%,#081426 100%);
      color:var(--text);
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .page{width:100%;max-width:560px}
    .card{
      background:rgba(11,21,40,.96);
      border:1px solid var(--line);
      border-radius:22px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }
    .head{
      padding:22px 22px 18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      background:linear-gradient(90deg,rgba(37,99,235,.24),rgba(37,99,235,.05));
    }
    .brand{
      font-size:1rem;
      font-weight:900;
      color:#bfdbfe;
      letter-spacing:.04em;
      margin-bottom:10px;
    }
    .title{
      font-size:2rem;
      font-weight:900;
      line-height:1.08;
      margin:0 0 8px;
    }
    .subtitle{
      color:var(--sub);
      font-size:1rem;
      line-height:1.6;
      font-weight:700;
    }
    .body{padding:22px}
    .field{margin-bottom:16px}
    .label{
      display:block;
      margin-bottom:8px;
      font-size:.96rem;
      font-weight:900;
      color:#dbeafe;
    }
    .input{
      width:100%;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(15,23,42,.95);
      color:#fff;
      padding:14px 14px;
      font-size:1rem;
      outline:none;
      transition:.18s ease;
    }
    .input:focus{
      border-color:rgba(96,165,250,.6);
      box-shadow:0 0 0 3px rgba(96,165,250,.12);
    }
    .help{
      font-size:.92rem;
      color:var(--sub);
      line-height:1.6;
      margin-top:8px;
      font-weight:700;
    }
    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:18px;
    }
    .btn{
      appearance:none;
      border:none;
      border-radius:14px;
      padding:13px 16px;
      cursor:pointer;
      font-size:1rem;
      font-weight:900;
      transition:.18s ease;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:48px;
    }
    .btn-primary{
      background:linear-gradient(90deg,#2563eb,#3b82f6);
      color:#fff;
      flex:1 1 220px;
    }
    .btn-primary:hover{filter:brightness(1.05)}
    .btn-secondary{
      background:rgba(30,41,59,.95);
      color:#fff;
      border:1px solid rgba(255,255,255,.12);
      flex:1 1 180px;
    }
    .btn-secondary:hover{background:rgba(51,65,85,.95)}
    .status{
      margin-top:18px;
      padding:14px 15px;
      border-radius:14px;
      font-size:.98rem;
      line-height:1.6;
      font-weight:800;
      display:none;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .status.show{display:block}
    .status.info{
      background:rgba(37,99,235,.14);
      border:1px solid rgba(96,165,250,.28);
      color:#dbeafe;
    }
    .status.success{
      background:rgba(34,197,94,.14);
      border:1px solid rgba(34,197,94,.28);
      color:#dcfce7;
    }
    .status.error{
      background:rgba(239,68,68,.14);
      border:1px solid rgba(239,68,68,.3);
      color:#fee2e2;
    }
    .footer{
      margin-top:16px;
      text-align:center;
      color:#93c5fd;
      font-size:.92rem;
      font-weight:800;
      line-height:1.6;
    }
    .hint-list{
      margin:0;
      padding-left:20px;
      color:var(--sub);
      line-height:1.7;
      font-weight:700;
      font-size:.94rem;
    }
    @media (max-width:560px){
      body{padding:14px}
      .title{font-size:1.7rem}
      .body,.head{padding:18px}
      .actions{flex-direction:column}
      .btn{width:100%}
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="head">
        <div class="brand">EMCQMS 急症醫學中心輪候系統</div>
        <h1 class="title">更新密碼</h1>
        <div class="subtitle">
          請輸入新密碼以完成重設程序。<br>
          Enter your new password to complete the password reset process.
        </div>
      </div>

      <div class="body">
        <div id="sessionStatus" class="status info show">正在檢查重設連結狀態…</div>

        <form id="updateForm" style="display:none;">
          <div class="field">
            <label class="label" for="password">新密碼</label>
            <input
              id="password"
              class="input"
              type="password"
              autocomplete="new-password"
              placeholder="請輸入新密碼"
              required
            />
          </div>

          <div class="field">
            <label class="label" for="confirmPassword">確認新密碼</label>
            <input
              id="confirmPassword"
              class="input"
              type="password"
              autocomplete="new-password"
              placeholder="請再次輸入新密碼"
              required
            />
            <div class="help">
              建議使用足夠長度及較高強度的密碼。
            </div>
          </div>

          <div class="field">
            <ul class="hint-list">
              <li>請從電郵內的重設密碼連結進入本頁。</li>
              <li>如果連結已過期，請返回「重設密碼」頁重新發送。</li>
            </ul>
          </div>

          <div class="actions">
            <button type="submit" class="btn btn-primary" id="updateBtn">更新密碼</button>
            <a class="btn btn-secondary" href="./reset-password.html">重新發送重設連結</a>
          </div>
        </form>

        <div id="resultBox" class="status info"></div>
      </div>
    </div>

    <div class="footer">
      急症醫學中心<br>
      Emergency Medicine Centre
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dvyberdrmmfgutjqnpjr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2eWJlcmRybW1mZ3V0anFucGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MDc3NTMsImV4cCI6MjA5MTQ4Mzc1M30.9aRRSP2xAAozx2bxH9a1Z13tDDwot82Mb8ax5hxirck";
    const HOME_URL = "https://rayleung2709.github.io/emc-cqms/";

    if (!window.supabase || typeof window.supabase.createClient !== "function") {
      document.body.innerHTML = '<div style="padding:24px;color:#fff;background:#06101f;font-family:Arial,sans-serif">Supabase SDK 載入失敗，請檢查網絡。</div>';
      throw new Error("Supabase SDK not loaded");
    }

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const sessionStatus = document.getElementById("sessionStatus");
    const updateForm = document.getElementById("updateForm");
    const updateBtn = document.getElementById("updateBtn");
    const resultBox = document.getElementById("resultBox");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");

    function showBox(el, message, type = "info") {
      el.className = `status show ${type}`;
      el.textContent = message;
    }

    function hideBox(el) {
      el.className = "status info";
      el.textContent = "";
    }

    function setLoading(loading) {
      updateBtn.disabled = !!loading;
      updateBtn.textContent = loading ? "更新中…" : "更新密碼";
    }

    function getHashParams() {
      const hash = window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "";
      return new URLSearchParams(hash);
    }

    async function establishRecoverySessionFromUrl() {
      const url = new URL(window.location.href);
      const query = url.searchParams;
      const hash = getHashParams();

      const access_token = query.get("access_token") || hash.get("access_token");
      const refresh_token = query.get("refresh_token") || hash.get("refresh_token");
      const type = query.get("type") || hash.get("type");

      if (access_token && refresh_token) {
        const { error } = await sb.auth.setSession({ access_token, refresh_token });
        if (error) throw error;
        return { hasRecoveryTokens: type === "recovery" || !!type, type: type || "" };
      }

      const { data, error } = await sb.auth.getSession();
      if (error) throw error;
      return { hasRecoveryTokens: !!data.session, type: type || "" };
    }

    async function initPage() {
      try {
        const result = await establishRecoverySessionFromUrl();

        if (!result.hasRecoveryTokens) {
          showBox(
            sessionStatus,
            "無法驗證此重設連結，可能已過期或無效。請返回重設密碼頁重新發送電郵。",
            "error"
          );
          updateForm.style.display = "none";
          return;
        }

        showBox(
          sessionStatus,
          "連結有效，請輸入新密碼。",
          "success"
        );
        updateForm.style.display = "block";
      } catch (err) {
        console.error(err);
        showBox(
          sessionStatus,
          `連結驗證失敗：${err.message || "未知錯誤"}\n請重新發送重設密碼電郵。`,
          "error"
        );
        updateForm.style.display = "none";
      }
    }

    updateForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      hideBox(resultBox);

      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!password || !confirmPassword) {
        showBox(resultBox, "請輸入並確認新密碼。", "error");
        return;
      }

      if (password.length < 6) {
        showBox(resultBox, "新密碼至少需要 6 個字元。", "error");
        return;
      }

      if (password !== confirmPassword) {
        showBox(resultBox, "兩次輸入的新密碼不一致。", "error");
        return;
      }

      setLoading(true);
      showBox(resultBox, "正在更新密碼…", "info");

      try {
        const { error } = await sb.auth.updateUser({
          password
        });

        if (error) throw error;

        showBox(
          resultBox,
          "密碼已成功更新。\n系統將於 2 秒後返回主頁。",
          "success"
        );

        setTimeout(() => {
          window.location.href = HOME_URL;
        }, 2000);
      } catch (err) {
        console.error(err);
        showBox(resultBox, `更新失敗：${err.message || "未知錯誤"}`, "error");
      } finally {
        setLoading(false);
      }
    });

    initPage();
  </script>
</body>
</html>

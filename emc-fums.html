<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Follow-up Management System</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #16202a;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #2563eb;
      --primary-2: #1d4ed8;
      --danger: #dc2626;
      --success: #16a34a;
      --warning: #d97706;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #fbfcff;
      padding: 20px;
      overflow: auto;
    }

    .main {
      padding: 20px;
      overflow: auto;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .grid-2 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select, textarea, button {
      width: 100%;
      font: inherit;
    }

    input, select, textarea {
      border: 1px solid var(--line);
      background: white;
      border-radius: 12px;
      padding: 10px 12px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 14px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-2);
    }

    .btn-secondary {
      background: #eef2ff;
      color: #1e3a8a;
    }

    .btn-danger {
      background: #fee2e2;
      color: #991b1b;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .toolbar .grow {
      flex: 1;
      min-width: 220px;
    }

    .kpis {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin-bottom: 16px;
    }

    .kpi {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .kpi .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .kpi .value {
      font-size: 28px;
      font-weight: 800;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .item {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .item:hover {
      transform: translateY(-1px);
    }

    .item.active {
      border-color: var(--primary);
      box-shadow: 0 12px 30px rgba(37,99,235,0.15);
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .title {
      font-size: 16px;
      font-weight: 800;
      margin: 0 0 8px;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }

    .status-new { background: #dbeafe; color: #1d4ed8; }
    .status-assigned { background: #ede9fe; color: #6d28d9; }
    .status-in_progress { background: #fef3c7; color: #92400e; }
    .status-waiting_patient { background: #fee2e2; color: #991b1b; }
    .status-waiting_doctor { background: #e0f2fe; color: #075985; }
    .status-completed { background: #dcfce7; color: #166534; }
    .status-closed { background: #e5e7eb; color: #374151; }

    .priority-low { background: #f3f4f6; color: #4b5563; }
    .priority-normal { background: #dbeafe; color: #1d4ed8; }
    .priority-high { background: #fef3c7; color: #92400e; }
    .priority-urgent { background: #fee2e2; color: #991b1b; }

    .detail {
      display: grid;
      gap: 16px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .timeline-item {
      border-left: 3px solid #cbd5e1;
      padding-left: 12px;
    }

    .timeline-item .t-title {
      font-weight: 700;
    }

    .timeline-item .t-meta {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    .attachment {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .muted { color: var(--muted); }
    .hidden { display: none !important; }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .pill {
      background: #eef2ff;
      color: #3730a3;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      display: inline-block;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: var(--muted);
      background: white;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
    }

    .auth-wrap {
      max-width: 480px;
      margin: 48px auto;
      padding: 16px;
    }

    .small {
      font-size: 12px;
    }

    .link-btn {
      background: transparent;
      color: var(--primary);
      padding: 0;
      text-align: left;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      max-width: 400px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.toast-error {
      background: #991b1b;
    }

    .toast.toast-success {
      background: #166534;
    }

    /* ── Loading spinner ── */
    .loading-text {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-weight: 600;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid var(--line);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .kpis {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .grid-2, .grid-3, .kpis {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Auth View -->
  <div id="authView" class="auth-wrap">
    <div class="card">
      <div class="brand">Follow-up System</div>
      <p class="muted">請先登入 Supabase 帳戶。</p>

      <div class="grid">
        <div>
          <label>Email</label>
          <input id="authEmail" type="email" placeholder="name@example.com" />
        </div>
        <div>
          <label>Password</label>
          <input id="authPassword" type="password" placeholder="********" />
        </div>
        <button id="loginBtn" class="btn-primary">Login</button>
        <button id="signupBtn" class="btn-secondary">Sign Up</button>
        <div id="authMsg" class="small muted"></div>
      </div>
    </div>
  </div>

  <!-- App View -->
  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="brand">Follow-up System</div>

      <div class="card">
        <div class="row" style="margin-bottom: 12px;">
          <div>
            <div id="meName" style="font-weight: 800;">-</div>
            <div id="meMeta" class="muted small">-</div>
          </div>
          <span id="meRole" class="pill">-</span>
        </div>
        <button id="logoutBtn" class="btn-secondary">Sign Out</button>
      </div>

      <div class="card">
        <div class="section-title">Create Follow-up</div>
        <div class="grid">
          <div>
            <label>Title</label>
            <input id="fTitle" placeholder="例如：Call patient regarding result" />
          </div>
          <div>
            <label>Description</label>
            <textarea id="fDescription" placeholder="請輸入描述"></textarea>
          </div>
          <div class="grid grid-2">
            <div>
              <label>Category</label>
              <select id="fCategory">
                <option value="general">general</option>
                <option value="abnormal_result">abnormal_result</option>
                <option value="appointment">appointment</option>
                <option value="billing">billing</option>
                <option value="insurance">insurance</option>
                <option value="medication">medication</option>
                <option value="procedure">procedure</option>
                <option value="document">document</option>
              </select>
            </div>
            <div>
              <label>Priority</label>
              <select id="fPriority">
                <option value="normal">normal</option>
                <option value="low">low</option>
                <option value="high">high</option>
                <option value="urgent">urgent</option>
              </select>
            </div>
          </div>

          <div class="grid grid-2">
            <div>
              <label>Status</label>
              <select id="fStatus">
                <option value="new">new</option>
                <option value="assigned">assigned</option>
                <option value="in_progress">in_progress</option>
                <option value="waiting_patient">waiting_patient</option>
                <option value="waiting_doctor">waiting_doctor</option>
                <option value="completed">completed</option>
                <option value="closed">closed</option>
              </select>
            </div>
            <div>
              <label>Team</label>
              <select id="fTeam">
                <option value="Reception">Reception</option>
                <option value="Nursing">Nursing</option>
                <option value="Doctor">Doctor</option>
              </select>
            </div>
          </div>

          <div class="grid grid-2">
            <div>
              <label>Due At</label>
              <input id="fDueAt" type="datetime-local" />
            </div>
            <div>
              <label>Doctor Name</label>
              <input id="fDoctorName" placeholder="Dr. Chan" />
            </div>
          </div>

          <div class="grid grid-2">
            <div>
              <label>CUMC No</label>
              <input id="fCumcNo" placeholder="CUMC-001" />
            </div>
            <div>
              <label>Encounter No</label>
              <input id="fEncounterNo" placeholder="ENC-001" />
            </div>
          </div>

          <div>
            <label>Requested By</label>
            <input id="fRequestedBy" placeholder="Doctor / Nurse / Patient" />
          </div>

          <div>
            <label>Next Action</label>
            <textarea id="fNextAction" placeholder="下一步"></textarea>
          </div>

          <div>
            <label>Owner</label>
            <select id="fOwner"></select>
          </div>

          <button id="createBtn" class="btn-primary">Create Follow-up</button>
          <div id="createMsg" class="small muted"></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h1 style="margin:0;">Follow-up Dashboard</h1>
          <div class="muted small">Supabase SQL + HTML demo</div>
        </div>
      </div>

      <div class="kpis">
        <div class="kpi">
          <div class="label">Total</div>
          <div id="kpiTotal" class="value">0</div>
        </div>
        <div class="kpi">
          <div class="label">Open</div>
          <div id="kpiOpen" class="value">0</div>
        </div>
        <div class="kpi">
          <div class="label">Urgent</div>
          <div id="kpiUrgent" class="value">0</div>
        </div>
        <div class="kpi">
          <div class="label">Completed / Closed</div>
          <div id="kpiDone" class="value">0</div>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <div class="grow">
            <label>Search</label>
            <input id="searchInput" placeholder="Search title / no / doctor / CUMC / encounter" />
          </div>
          <div>
            <label>Status</label>
            <select id="filterStatus">
              <option value="">all</option>
              <option value="new">new</option>
              <option value="assigned">assigned</option>
              <option value="in_progress">in_progress</option>
              <option value="waiting_patient">waiting_patient</option>
              <option value="waiting_doctor">waiting_doctor</option>
              <option value="completed">completed</option>
              <option value="closed">closed</option>
            </select>
          </div>
          <div>
            <label>Priority</label>
            <select id="filterPriority">
              <option value="">all</option>
              <option value="low">low</option>
              <option value="normal">normal</option>
              <option value="high">high</option>
              <option value="urgent">urgent</option>
            </select>
          </div>
          <div style="display:flex; align-items:end;">
            <button id="refreshBtn" class="btn-secondary">Refresh</button>
          </div>
        </div>
      </div>

      <div class="grid grid-2">
        <section>
          <div class="card">
            <div class="section-title">Follow-up List</div>
            <div id="listContainer" class="list"></div>
          </div>
        </section>

        <section>
          <div class="card detail">
            <div class="section-title">Detail</div>
            <div id="detailContainer" class="empty">請先揀一筆 follow-up</div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    /* ══════════════════════════════════════
       Supabase Init
    ══════════════════════════════════════ */
    const SUPABASE_URL = 'https://tvwqbjqhrnpeulsoacdh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR2d3FianFocm5wZXVsc29hY2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3NDMyNTUsImV4cCI6MjA5MjMxOTI1NX0.SVqyxJ7OYQ--eaXf6qsMfgGYrbTMcz3Q-1kwmxCH-Zk';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ══════════════════════════════════════
       State
    ══════════════════════════════════════ */
    let currentUser = null;
    let currentProfile = null;
    let profiles = [];
    let followups = [];
    let selectedFollowupId = null;
    let isBooting = false;

    const authView = document.getElementById('authView');
    const appView = document.getElementById('appView');

    /* ══════════════════════════════════════
       Toast（取代 alert）
    ══════════════════════════════════════ */
    let toastTimer = null;

    function showToast(msg, type = 'info', duration = 3500) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast';
      if (type === 'error') el.classList.add('toast-error');
      if (type === 'success') el.classList.add('toast-success');
      clearTimeout(toastTimer);
      requestAnimationFrame(() => el.classList.add('show'));
      toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, duration);
    }

    /* ══════════════════════════════════════
       Helpers
    ══════════════════════════════════════ */
    function showAuth() {
      authView.classList.remove('hidden');
      appView.classList.add('hidden');
    }

    function showApp() {
      authView.classList.add('hidden');
      appView.classList.remove('hidden');
    }

    function fmtDate(v) {
      if (!v) return '-';
      const d = new Date(v);
      if (isNaN(d.getTime())) return v;
      return d.toLocaleString();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function statusBadgeClass(status) {
      return `status-${status}`;
    }

    function priorityBadgeClass(priority) {
      return `priority-${priority}`;
    }

    function setAuthMsg(msg, isError = false) {
      const el = document.getElementById('authMsg');
      el.textContent = msg || '';
      el.style.color = isError ? '#b91c1c' : '';
    }

    function setCreateMsg(msg, isError = false) {
      const el = document.getElementById('createMsg');
      el.textContent = msg || '';
      el.style.color = isError ? '#b91c1c' : '';
    }

    function loadingHtml(text) {
      return `<div class="loading-text"><span class="spinner"></span>${escapeHtml(text || 'Loading...')}</div>`;
    }

    /* ══════════════════════════════════════
       Auth
    ══════════════════════════════════════ */
    async function signUp() {
      try {
        setAuthMsg('Signing up...');
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value.trim();

        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;

        setAuthMsg('Sign up success. 如果開咗 email confirm，請先確認電郵。');
      } catch (err) {
        console.error('signUp error:', err);
        setAuthMsg(err.message, true);
      }
    }

    async function login() {
      try {
        setAuthMsg('Logging in...');
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value.trim();

        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;

        setAuthMsg('Login success.');
        // onAuthStateChange 會自動觸發 boot()，呢度唔需要手動 call
      } catch (err) {
        console.error('login error:', err);
        setAuthMsg(err.message, true);
      }
    }

    async function logout() {
      await sb.auth.signOut();
      currentUser = null;
      currentProfile = null;
      profiles = [];
      followups = [];
      selectedFollowupId = null;
      showAuth();
    }

    async function loadSession() {
      const { data, error } = await sb.auth.getSession();
      if (error) throw error;
      currentUser = data.session?.user || null;
      return currentUser;
    }

    /* ══════════════════════════════════════
       Profile
    ══════════════════════════════════════ */
    async function loadMyProfile() {
      if (!currentUser) return null;

      const { data, error } = await sb
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .maybeSingle();

      if (error) throw error;

      if (!data) {
        currentProfile = {
          id: currentUser.id,
          email: currentUser.email || '-',
          full_name: currentUser.email || 'Unknown User',
          role: 'user',
          team: '-'
        };
      } else {
        currentProfile = data;
      }

      document.getElementById('meName').textContent = currentProfile.full_name || '-';
      document.getElementById('meMeta').textContent = `${currentProfile.email || '-'} · ${currentProfile.team || '-'}`;
      document.getElementById('meRole').textContent = currentProfile.role || '-';
      return currentProfile;
    }

    async function loadProfilesForOwnerSelect() {
      const { data, error } = await sb
        .from('profiles')
        .select('id, full_name, email, role, team, is_active')
        .order('full_name', { ascending: true });

      if (error) {
        console.warn('loadProfilesForOwnerSelect failed:', error.message);
        profiles = currentProfile ? [currentProfile] : [];
      } else {
        profiles = data || [];
        if (!profiles.length && currentProfile) {
          profiles = [currentProfile];
        }
      }

      const ownerSelect = document.getElementById('fOwner');
      ownerSelect.innerHTML = '';

      const emptyOpt = document.createElement('option');
      emptyOpt.value = '';
      emptyOpt.textContent = 'Unassigned';
      emptyOpt.selected = true;           // ← 預設 Unassigned
      ownerSelect.appendChild(emptyOpt);

      for (const p of profiles) {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.full_name || p.email || 'Unknown'} (${p.team || '-'} / ${p.role || '-'})`;
        // 不再自動選中 currentProfile
        ownerSelect.appendChild(opt);
      }
    }

    /* ══════════════════════════════════════
       KPIs（獨立於 filter，始終顯示全域數據）
    ══════════════════════════════════════ */
    async function loadKPIs() {
      try {
        const { data, error } = await sb
          .from('followups')
          .select('status, priority');

        if (error) throw error;

        const all = data || [];
        const total = all.length;
        const open = all.filter(f => !['completed', 'closed'].includes(f.status)).length;
        const urgent = all.filter(f => f.priority === 'urgent').length;
        const done = all.filter(f => ['completed', 'closed'].includes(f.status)).length;

        document.getElementById('kpiTotal').textContent = total;
        document.getElementById('kpiOpen').textContent = open;
        document.getElementById('kpiUrgent').textContent = urgent;
        document.getElementById('kpiDone').textContent = done;
      } catch (err) {
        console.error('loadKPIs error:', err);
      }
    }

    /* ══════════════════════════════════════
       Follow-ups（List）
    ══════════════════════════════════════ */
    async function loadFollowups() {
      const container = document.getElementById('listContainer');
      container.innerHTML = loadingHtml('載入中...');

      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const priority = document.getElementById('filterPriority').value;

      let query = sb
        .from('followups')
        .select('*')
        .order('created_at', { ascending: false });

      if (status) query = query.eq('status', status);
      if (priority) query = query.eq('priority', priority);

      const { data, error } = await query;
      if (error) throw error;

      let rows = data || [];

      if (search) {
        rows = rows.filter(r => {
          const bag = [
            r.followup_no,
            r.title,
            r.description,
            r.doctor_name,
            r.cumc_no,
            r.encounter_no
          ].join(' ').toLowerCase();

          return bag.includes(search);
        });
      }

      followups = rows;
      renderList();
    }

    /* ══════════════════════════════════════
       Create Follow-up
    ══════════════════════════════════════ */
    async function createFollowup() {
      try {
        setCreateMsg('Creating...');
        const payload = {
          title: document.getElementById('fTitle').value.trim(),
          description: document.getElementById('fDescription').value.trim() || null,
          category: document.getElementById('fCategory').value,
          priority: document.getElementById('fPriority').value,
          status: document.getElementById('fStatus').value,
          team: document.getElementById('fTeam').value,
          due_at: document.getElementById('fDueAt').value
            ? new Date(document.getElementById('fDueAt').value).toISOString()
            : null,
          doctor_name: document.getElementById('fDoctorName').value.trim() || null,
          cumc_no: document.getElementById('fCumcNo').value.trim() || null,
          encounter_no: document.getElementById('fEncounterNo').value.trim() || null,
          requested_by: document.getElementById('fRequestedBy').value.trim() || null,
          next_action: document.getElementById('fNextAction').value.trim() || null,
          owner_id: document.getElementById('fOwner').value || null,
          created_by: currentUser.id,
          updated_by: currentUser.id
        };

        if (!payload.title) {
          throw new Error('Title is required');
        }

        const { data, error } = await sb
          .from('followups')
          .insert(payload)
          .select('*')
          .single();

        if (error) throw error;

        setCreateMsg(`Created: ${data.followup_no || data.id}`);
        showToast(`已建立 Follow-up: ${data.followup_no || data.id}`, 'success');

        document.getElementById('fTitle').value = '';
        document.getElementById('fDescription').value = '';
        document.getElementById('fDoctorName').value = '';
        document.getElementById('fCumcNo').value = '';
        document.getElementById('fEncounterNo').value = '';
        document.getElementById('fRequestedBy').value = '';
        document.getElementById('fNextAction').value = '';
        document.getElementById('fDueAt').value = '';

        await Promise.all([loadFollowups(), loadKPIs()]);
        selectedFollowupId = data.id;
        renderList();
        await renderDetail();
      } catch (err) {
        console.error('createFollowup error:', err);
        setCreateMsg(err.message, true);
        showToast(err.message, 'error');
      }
    }

    /* ══════════════════════════════════════
       Render List
    ══════════════════════════════════════ */
    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      if (!followups.length) {
        container.innerHTML = '<div class="empty">沒有資料</div>';
        return;
      }

      for (const item of followups) {
        const div = document.createElement('div');
        div.className = `item ${selectedFollowupId === item.id ? 'active' : ''}`;
        div.innerHTML = `
          <div class="row">
            <div>
              <div class="title">${escapeHtml(item.title)}</div>
              <div class="meta">
                <span>${escapeHtml(item.followup_no || item.id)}</span>
                <span>Team: ${escapeHtml(item.team || '-')}</span>
                <span>Doctor: ${escapeHtml(item.doctor_name || '-')}</span>
                <span>Due: ${escapeHtml(fmtDate(item.due_at))}</span>
              </div>
              <div class="badges">
                <span class="badge ${statusBadgeClass(item.status)}">${escapeHtml(item.status)}</span>
                <span class="badge ${priorityBadgeClass(item.priority)}">${escapeHtml(item.priority)}</span>
              </div>
            </div>
          </div>
        `;
        div.addEventListener('click', async () => {
          selectedFollowupId = item.id;
          renderList();
          await renderDetail();
        });
        container.appendChild(div);
      }
    }

    /* ══════════════════════════════════════
       Detail
    ══════════════════════════════════════ */
    async function getFollowupDetail(id) {
      const { data: followup, error: e1 } = await sb
        .from('followups')
        .select('*')
        .eq('id', id)
        .single();

      if (e1) throw e1;

      const { data: timeline, error: e2 } = await sb
        .from('followup_timeline')
        .select('*')
        .eq('followup_id', id)
        .order('created_at', { ascending: false });

      if (e2) throw e2;

      const { data: attachments, error: e3 } = await sb
        .from('attachments')
        .select('*')
        .eq('followup_id', id)
        .eq('status', 'stored')
        .order('uploaded_at', { ascending: false });

      if (e3) throw e3;

      return {
        followup,
        timeline: timeline || [],
        attachments: attachments || []
      };
    }

    async function updateFollowup(id) {
      const status = document.getElementById('dStatus').value;
      const team = document.getElementById('dTeam').value;
      const ownerId = document.getElementById('dOwner').value || null;
      const outcome = document.getElementById('dOutcome').value.trim() || null;
      const nextAction = document.getElementById('dNextAction').value.trim() || null;
      const dueAt = document.getElementById('dDueAt').value
        ? new Date(document.getElementById('dDueAt').value).toISOString()
        : null;

      // 先取得舊資料用作比較
      const { data: oldData } = await sb
        .from('followups')
        .select('status, team, owner_id')
        .eq('id', id)
        .single();

      const payload = {
        status,
        team,
        owner_id: ownerId,
        outcome_summary: outcome,
        next_action: nextAction,
        due_at: dueAt,
        updated_by: currentUser.id
      };

      if (status === 'completed') {
        payload.completed_at = new Date().toISOString();
      }

      if (status === 'closed') {
        payload.closed_at = new Date().toISOString();
      }

      const { error } = await sb
        .from('followups')
        .update(payload)
        .eq('id', id);

      if (error) throw error;

      // ── 寫 timeline 記錄 ──
      const changes = [];
      if (oldData) {
        if (oldData.status !== status) changes.push(`Status: ${oldData.status} → ${status}`);
        if (oldData.team !== team) changes.push(`Team: ${oldData.team} → ${team}`);
        if (oldData.owner_id !== ownerId) changes.push('Owner updated');
      }

      const timelineNote = changes.length
        ? changes.join('; ')
        : 'Fields updated';

      await sb.from('followup_timeline').insert({
        followup_id: id,
        event_type: 'updated',
        title: 'Follow-up updated',
        note: timelineNote,
        actor_id: currentUser.id
      });
    }

    async function uploadAttachment(followupId, file) {
      if (!file) throw new Error('No file selected');

      const safeName = `${followupId}/${Date.now()}-${file.name.replace(/\s+/g, '_')}`;

      const { error: uploadError } = await sb
        .storage
        .from('followup-files')
        .upload(safeName, file, { upsert: false });

      if (uploadError) throw uploadError;

      const { error: insertError } = await sb
        .from('attachments')
        .insert({
          followup_id: followupId,
          file_name: file.name,
          file_path: safeName,
          mime_type: file.type || null,
          file_size: file.size || null,
          uploaded_by: currentUser.id
        });

      if (insertError) throw insertError;

      await sb.from('followup_timeline').insert({
        followup_id: followupId,
        event_type: 'attachment_uploaded',
        title: 'Attachment uploaded',
        note: file.name,
        actor_id: currentUser.id
      });
    }

    async function getAttachmentSignedUrl(filePath) {
      const { data, error } = await sb
        .storage
        .from('followup-files')
        .createSignedUrl(filePath, 60 * 10);

      if (error) throw error;
      return data.signedUrl;
    }

    async function renderDetail() {
      const container = document.getElementById('detailContainer');

      if (!selectedFollowupId) {
        container.className = 'empty';
        container.textContent = '請先揀一筆 follow-up';
        return;
      }

      try {
        container.className = '';
        container.innerHTML = loadingHtml('載入詳情...');

        const detail = await getFollowupDetail(selectedFollowupId);
        const f = detail.followup;

        let ownerOptions = '<option value="">Unassigned</option>';
        for (const p of profiles) {
          ownerOptions += `<option value="${p.id}" ${f.owner_id === p.id ? 'selected' : ''}>${escapeHtml(p.full_name || p.email || 'Unknown')} (${escapeHtml(p.team || '-')} / ${escapeHtml(p.role || '-')})</option>`;
        }

        const attachmentHtml = detail.attachments.length
          ? detail.attachments.map(a => `
              <div class="attachment">
                <div>
                  <div style="font-weight:700;">${escapeHtml(a.file_name)}</div>
                  <div class="small muted">${escapeHtml(a.mime_type || '-')} · ${a.file_size || 0} bytes · ${fmtDate(a.uploaded_at)}</div>
                </div>
                <button class="btn-secondary small open-att-btn" data-path="${escapeHtml(a.file_path)}">Open</button>
              </div>
            `).join('')
          : '<div class="muted">No attachments</div>';

        const timelineHtml = detail.timeline.length
          ? detail.timeline.map(t => `
              <div class="timeline-item">
                <div class="t-title">${escapeHtml(t.title)}</div>
                <div class="small">${escapeHtml(t.note || '')}</div>
                <div class="t-meta">${escapeHtml(t.event_type)} · ${fmtDate(t.created_at)}</div>
              </div>
            `).join('')
          : '<div class="muted">No timeline yet</div>';

        // due_at 係 UTC，需要轉成本地時間先可以填入 datetime-local input
        // getTimezoneOffset() 回傳嘅係 UTC − local（分鐘），所以要減去 offset
        const dueLocal = f.due_at
          ? new Date(new Date(f.due_at).getTime() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16)
          : '';

        container.innerHTML = `
          <div class="grid">
            <div class="row">
              <div>
                <div class="title">${escapeHtml(f.title)}</div>
                <div class="meta">
                  <span>${escapeHtml(f.followup_no || f.id)}</span>
                  <span>CUMC: ${escapeHtml(f.cumc_no || '-')}</span>
                  <span>Encounter: ${escapeHtml(f.encounter_no || '-')}</span>
                </div>
              </div>
              <div class="badges">
                <span class="badge ${statusBadgeClass(f.status)}">${escapeHtml(f.status)}</span>
                <span class="badge ${priorityBadgeClass(f.priority)}">${escapeHtml(f.priority)}</span>
              </div>
            </div>

            <div class="card" style="margin:0;">
              <div class="section-title">Summary</div>
              <div class="grid">
                <div><strong>Description:</strong><br>${escapeHtml(f.description || '-')}</div>
                <div><strong>Doctor:</strong> ${escapeHtml(f.doctor_name || '-')}</div>
                <div><strong>Requested By:</strong> ${escapeHtml(f.requested_by || '-')}</div>
                <div><strong>Created At:</strong> ${escapeHtml(fmtDate(f.created_at))}</div>
                <div><strong>Due At:</strong> ${escapeHtml(fmtDate(f.due_at))}</div>
                <div><strong>Next Action:</strong><br>${escapeHtml(f.next_action || '-')}</div>
                <div><strong>Outcome Summary:</strong><br>${escapeHtml(f.outcome_summary || '-')}</div>
              </div>
            </div>

            <div class="card" style="margin:0;">
              <div class="section-title">Update</div>
              <div class="grid">
                <div class="grid grid-3">
                  <div>
                    <label>Status</label>
                    <select id="dStatus">
                      <option value="new" ${f.status === 'new' ? 'selected' : ''}>new</option>
                      <option value="assigned" ${f.status === 'assigned' ? 'selected' : ''}>assigned</option>
                      <option value="in_progress" ${f.status === 'in_progress' ? 'selected' : ''}>in_progress</option>
                      <option value="waiting_patient" ${f.status === 'waiting_patient' ? 'selected' : ''}>waiting_patient</option>
                      <option value="waiting_doctor" ${f.status === 'waiting_doctor' ? 'selected' : ''}>waiting_doctor</option>
                      <option value="completed" ${f.status === 'completed' ? 'selected' : ''}>completed</option>
                      <option value="closed" ${f.status === 'closed' ? 'selected' : ''}>closed</option>
                    </select>
                  </div>
                  <div>
                    <label>Team</label>
                    <select id="dTeam">
                      <option value="Reception" ${f.team === 'Reception' ? 'selected' : ''}>Reception</option>
                      <option value="Nursing" ${f.team === 'Nursing' ? 'selected' : ''}>Nursing</option>
                      <option value="Doctor" ${f.team === 'Doctor' ? 'selected' : ''}>Doctor</option>
                    </select>
                  </div>
                  <div>
                    <label>Owner</label>
                    <select id="dOwner">${ownerOptions}</select>
                  </div>
                </div>

                <div>
                  <label>Due At</label>
                  <input id="dDueAt" type="datetime-local" value="${dueLocal}" />
                </div>

                <div>
                  <label>Next Action</label>
                  <textarea id="dNextAction">${escapeHtml(f.next_action || '')}</textarea>
                </div>

                <div>
                  <label>Outcome Summary</label>
                  <textarea id="dOutcome">${escapeHtml(f.outcome_summary || '')}</textarea>
                </div>

                <button id="saveDetailBtn" class="btn-primary">Save Update</button>
                <div id="detailMsg" class="small muted"></div>
              </div>
            </div>

            <div class="card" style="margin:0;">
              <div class="section-title">Attachments</div>
              <div class="grid">
                <input id="fileInput" type="file" />
                <button id="uploadBtn" class="btn-secondary">Upload Attachment</button>
                <div id="attachmentMsg" class="small muted"></div>
                <div class="grid">${attachmentHtml}</div>
              </div>
            </div>

            <div class="card" style="margin:0;">
              <div class="section-title">Timeline</div>
              <div class="timeline">${timelineHtml}</div>
            </div>
          </div>
        `;

        /* ── Detail: Save ── */
        document.getElementById('saveDetailBtn').addEventListener('click', async () => {
          const msg = document.getElementById('detailMsg');
          try {
            msg.textContent = 'Saving...';
            msg.style.color = '';
            await updateFollowup(f.id);
            msg.textContent = 'Saved.';
            showToast('已儲存更新', 'success');
            await Promise.all([loadFollowups(), loadKPIs()]);
            await renderDetail();
          } catch (err) {
            console.error('updateFollowup error:', err);
            msg.textContent = err.message;
            msg.style.color = '#b91c1c';
            showToast(err.message, 'error');
          }
        });

        /* ── Detail: Upload ── */
        document.getElementById('uploadBtn').addEventListener('click', async () => {
          const msg = document.getElementById('attachmentMsg');
          try {
            msg.textContent = 'Uploading...';
            msg.style.color = '';
            const file = document.getElementById('fileInput').files[0];
            await uploadAttachment(f.id, file);
            msg.textContent = 'Uploaded.';
            showToast('附件已上傳', 'success');
            await renderDetail();
          } catch (err) {
            console.error('uploadAttachment error:', err);
            msg.textContent = err.message;
            msg.style.color = '#b91c1c';
            showToast(err.message, 'error');
          }
        });

        /* ── Detail: Open Attachment（用 data attribute + event delegation，避免 inline onclick 注入風險）── */
        container.querySelectorAll('.open-att-btn').forEach(btn => {
          btn.addEventListener('click', async (e) => {
            e.stopPropagation();
            try {
              const url = await getAttachmentSignedUrl(btn.dataset.path);
              window.open(url, '_blank');
            } catch (err) {
              console.error('openAttachment error:', err);
              showToast('無法開啟附件：' + err.message, 'error');
            }
          });
        });

      } catch (err) {
        console.error('renderDetail error:', err);
        container.className = 'empty';
        container.textContent = err.message;
      }
    }

    /* ══════════════════════════════════════
       Boot（加 guard 防止重複執行）
    ══════════════════════════════════════ */
    async function boot() {
      if (isBooting) return;
      isBooting = true;

      try {
        console.log('boot start');
        await loadSession();
        console.log('currentUser after loadSession:', currentUser);

        if (!currentUser) {
          console.log('no currentUser');
          showAuth();
          return;
        }

        showApp();

        console.log('loading profile...');
        await loadMyProfile();
        console.log('profile loaded:', currentProfile);

        console.log('loading profiles...');
        await loadProfilesForOwnerSelect();

        console.log('loading followups & KPIs...');
        await Promise.all([loadFollowups(), loadKPIs()]);

        if (followups.length && !selectedFollowupId) {
          selectedFollowupId = followups[0].id;
        }

        renderList();
        await renderDetail();
        console.log('boot done');
      } catch (err) {
        console.error('boot error:', err);
        showApp();
        document.getElementById('detailContainer').innerHTML =
          `<div class="empty">Boot error: ${escapeHtml(err.message)}</div>`;
      } finally {
        isBooting = false;
      }
    }

    /* ══════════════════════════════════════
       Event Listeners
    ══════════════════════════════════════ */
    document.getElementById('loginBtn').addEventListener('click', login);
    document.getElementById('signupBtn').addEventListener('click', signUp);
    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('createBtn').addEventListener('click', createFollowup);

    document.getElementById('refreshBtn').addEventListener('click', async () => {
      try {
        await Promise.all([loadFollowups(), loadKPIs()]);
        await renderDetail();
        showToast('已重新整理', 'success');
      } catch (err) {
        console.error('refresh error:', err);
        showToast('重新整理失敗：' + err.message, 'error');
      }
    });

    // Search：加 debounce，300ms 內只觸發一次，避免每個 keystroke 都 query Supabase
    let searchTimer = null;
    document.getElementById('searchInput').addEventListener('input', () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        loadFollowups().catch(err => console.error('search error:', err));
      }, 300);
    });

    // Filter：正確 catch async error
    document.getElementById('filterStatus').addEventListener('change', () => {
      loadFollowups().catch(err => console.error('filter status error:', err));
    });

    document.getElementById('filterPriority').addEventListener('change', () => {
      loadFollowups().catch(err => console.error('filter priority error:', err));
    });

    /* ══════════════════════════════════════
       Auth State Change（唯一觸發 boot 嘅入口）
    ══════════════════════════════════════ */
    sb.auth.onAuthStateChange(async (event, session) => {
      console.log('onAuthStateChange:', event);
      currentUser = session?.user || null;

      if (currentUser && (event === 'INITIAL_SESSION' || event === 'SIGNED_IN')) {
        showApp();
        await boot();
      } else if (!currentUser) {
        showAuth();
      }
      // TOKEN_REFRESHED 等其他 event 唔需要重新 boot
    });

    // 不再直接 call boot() — 由 onAuthStateChange (INITIAL_SESSION) 負責
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EMCQMS 急症醫學中心輪候系統</title>
<link rel="icon" href="data:," />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --board-bg: #06101f;
  --board-panel: #0b1528;
  --board-panel-2: #0f1b33;
  --board-text: #f8fafc;
  --board-sub: #cbd5e1;
  --board-line: rgba(255,255,255,0.12);
  --board-blue: #60a5fa;
  --board-green: #4ade80;
  --board-yellow: #fde68a;
  --board-red: #fca5a5;
  --shadow: 0 12px 30px rgba(0,0,0,0.28);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: Arial, "Microsoft JhengHei", "PingFang TC", sans-serif;
  background: var(--board-bg);
  color: var(--board-text);
}

body {
  min-height: 100vh;
  overflow: hidden;
}

.app {
  width: 100%;
  min-height: 100vh;
  padding: 10px 12px 8px;
  background: var(--board-bg);
  display: flex;
  flex-direction: column;
}

.board-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  flex-wrap: wrap;
  color: var(--board-text);
  flex: 0 0 auto;
}

.board-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.board-title {
  font-size: 2.45rem;
  font-weight: 900;
  color: var(--board-text);
  letter-spacing: 0.02em;
  line-height: 1.02;
}

.board-subtitle {
  font-size: 0.95rem;
  color: var(--board-sub);
  font-weight: 800;
  letter-spacing: 0.05em;
  line-height: 1.05;
}

.board-toolbar-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.toolbar-chip-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.toolbar-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  border-radius: 999px;
  padding: 6px 12px;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(15,23,42,0.9);
  color: #e2e8f0;
  font-size: 0.82rem;
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
}

.toolbar-chip.status-ok {
  border-color: rgba(34,197,94,0.35);
  color: #bbf7d0;
}

.toolbar-chip.status-warn {
  border-color: rgba(245,158,11,0.4);
  color: #fde68a;
}

.toolbar-btn {
  appearance: none;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(30,41,59,0.92);
  color: #fff;
  border-radius: 999px;
  padding: 8px 12px;
  font-weight: 900;
  cursor: pointer;
  font-size: 0.82rem;
}

.toolbar-btn:hover {
  background: rgba(37,99,235,0.95);
  border-color: rgba(96,165,250,0.5);
}

.board-time {
  font-size: 1.32rem;
  color: var(--board-sub);
  font-weight: 900;
  letter-spacing: 0.03em;
  line-height: 1;
}

.info-card {
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(15,23,42,0.95);
  border-radius: 14px;
  padding: 8px 12px;
  margin-bottom: 8px;
  flex: 0 0 auto;
}

.inline-note {
  font-size: 0.9rem;
  color: #dbeafe;
  font-weight: 800;
  line-height: 1.35;
}

#displayBoard {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.board-pagination-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  flex: 0 0 auto;
  color: var(--board-text);
}

.board-page-indicator {
  font-size: 1rem;
  font-weight: 900;
  color: #bfdbfe;
  letter-spacing: 0.03em;
}

.board-page-dots {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.board-dot {
  width: 12px;
  height: 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.22);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12);
}

.board-dot.active {
  background: #60a5fa;
  box-shadow: 0 0 0 3px rgba(96,165,250,0.18);
}

/* =========================
   LANDSCAPE / DESKTOP TABLE
   ========================= */
.board-wrap.desktop-layout {
  background: var(--board-panel);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  box-shadow: var(--shadow);
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
}

.board-head {
  display: grid;
  grid-template-columns: 0.62fr 1fr 1.05fr 2.6fr 1.35fr 1.2fr;
  background: linear-gradient(90deg, #1d4ed8 0%, #2563eb 100%);
  color: #fff;
  font-weight: 900;
  padding: 0;
}

.board-head div {
  padding: 11px 8px 10px;
  border-right: 1px solid rgba(255,255,255,0.16);
  text-align: center;
}

.board-head div:last-child { border-right: none; }

.board-head-zh {
  display: block;
  font-size: 1.4rem;
  line-height: 1.02;
  margin-bottom: 3px;
  font-weight: 900;
  white-space: nowrap;
}

.board-head-en {
  display: block;
  font-size: 0.78rem;
  line-height: 1.04;
  opacity: 0.96;
  font-weight: 800;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.board-body {
  background: var(--board-panel);
  display: grid;
  grid-template-rows: repeat(3, minmax(0, 1fr));
  height: calc(100% - 0px);
  min-height: 0;
}

.board-row {
  display: grid;
  grid-template-columns: 0.62fr 1fr 1.05fr 2.6fr 1.35fr 1.2fr;
  align-items: stretch;
  border-top: 1px solid var(--board-line);
  min-height: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0));
}

.board-cell {
  padding: 10px 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-right: 1px solid rgba(255,255,255,0.08);
  font-weight: 800;
  color: var(--board-text);
  min-width: 0;
  overflow: hidden;
}

.board-cell:last-child { border-right: none; }

.board-room {
  font-size: 4.4rem;
  color: #93c5fd;
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1;
  white-space: nowrap;
}

.board-doctor {
  flex-direction: column;
  gap: 4px;
  align-items: flex-start;
  text-align: left;
  justify-content: center;
  overflow: hidden;
}

.board-doctor-zh {
  font-size: 1.55rem;
  color: #ffffff;
  font-weight: 900;
  line-height: 1.06;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.board-doctor-en {
  font-size: 0.96rem;
  color: var(--board-sub);
  font-weight: 800;
  line-height: 1.08;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.board-current {
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.board-current-ticket,
.board-current-normal-ticket {
  font-size: 2.45rem;
  font-weight: 900;
  line-height: 1.02;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.board-current-ticket-red { color: #fca5a5; }
.board-current-ticket-yellow { color: #fde68a; }
.board-current-ticket-green { color: #4ade80; }

.board-meta {
  font-size: 0.92rem;
  color: var(--board-sub);
  font-weight: 800;
  line-height: 1.12;
}

.board-paused {
  color: #fbbf24;
  font-size: 2.1rem;
  line-height: 1.05;
  word-break: break-word;
  font-weight: 900;
}

.board-queue, .board-skip, .board-review {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  justify-content: flex-start;
  align-content: center;
  width: 100%;
  text-align: left;
  overflow: hidden;
}

.board-tag {
  border-radius: 999px;
  padding: 8px 12px;
  font-size: 1.28rem;
  font-weight: 900;
  min-width: 88px;
  text-align: center;
  line-height: 1;
  white-space: nowrap;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
  background: rgba(37,99,235,0.16);
  color: #bfdbfe;
  border: 1px solid rgba(96,165,250,0.42);
}

.tag-review {
  background: rgba(245,158,11,0.14);
  color: #fde68a;
  border: 1px solid rgba(245,158,11,0.45);
}

.tag-skip {
  background: rgba(239,68,68,0.12);
  color: #fecaca;
  border: 1px solid rgba(248,113,113,0.4);
}

.tag-priority {
  background: rgba(185,28,28,0.2);
  color: #fee2e2;
  border: 2px solid #ef4444;
  box-shadow: 0 0 0 2px rgba(239,68,68,0.12) inset;
}

.tag-yellow {
  background: rgba(234,179,8,0.22);
  color: #fef9c3;
  border: 2px solid #eab308;
  box-shadow: 0 0 0 2px rgba(234,179,8,0.08) inset;
}

.board-empty {
  color: #94a3b8;
  font-size: 1rem;
  font-weight: 800;
  white-space: nowrap;
}

.board-cutoff-tag {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-width: 92px;
  padding: 6px 8px;
  border-radius: 999px;
  background: rgba(245, 158, 11, 0.14);
  border: 2px solid rgba(245, 158, 11, 0.72);
  line-height: 1.02;
  text-align: center;
}

.board-cutoff-zh {
  color: #facc15;
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.02em;
  white-space: nowrap;
}

.board-cutoff-en {
  color: #fde68a;
  font-size: 0.54rem;
  font-weight: 900;
  letter-spacing: 0.04em;
  white-space: nowrap;
  text-transform: uppercase;
}

/* =========================
   PORTRAIT / MOBILE CARD
   ========================= */
.board-mobile-list {
  display: none;
  flex-direction: column;
  gap: 8px;
  flex: 1 1 auto;
  min-height: 0;
}

.mobile-room-card {
  background: linear-gradient(180deg, var(--board-panel), var(--board-panel-2));
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  box-shadow: var(--shadow);
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 0;
  flex: 1 1 0;
}

.mobile-room-head {
  display: grid;
  grid-template-columns: 70px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px 12px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  background: linear-gradient(90deg, rgba(29,78,216,0.22), rgba(37,99,235,0.08));
}

.mobile-room-no {
  font-size: 2.7rem;
  line-height: 1;
  font-weight: 900;
  color: #93c5fd;
  white-space: nowrap;
  text-align: center;
}

.mobile-room-doctor {
  min-width: 0;
}

.mobile-room-doctor .board-doctor-zh {
  font-size: 1.4rem;
  line-height: 1.06;
}

.mobile-room-doctor .board-doctor-en {
  font-size: 0.9rem;
  line-height: 1.06;
}

.mobile-room-status {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
}

.mobile-room-body {
  padding: 8px 10px 10px;
  display: grid;
  grid-template-columns: 1.05fr 1fr 1fr 1fr;
  gap: 8px;
  min-height: 0;
}

.mobile-section {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 8px;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.mobile-section-title {
  font-size: 0.92rem;
  font-weight: 900;
  color: #bfdbfe;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  line-height: 1.02;
}

.mobile-section-title small {
  font-size: 0.68rem;
  color: var(--board-sub);
  font-weight: 800;
  white-space: nowrap;
}

.mobile-current-box {
  display: flex;
  flex-direction: column;
  gap: 5px;
  justify-content: center;
  min-height: 0;
  flex: 1 1 auto;
}

.mobile-current-label {
  font-size: 0.8rem;
  color: var(--board-sub);
  font-weight: 800;
  line-height: 1;
}

.mobile-current-ticket {
  font-size: 2rem;
  font-weight: 900;
  line-height: 1.02;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.mobile-tag-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-content: flex-start;
  overflow: hidden;
}

.mobile-empty {
  color: #94a3b8;
  font-size: 0.94rem;
  font-weight: 800;
}

.board-footer-tip {
  margin-top: 6px;
  color: #93c5fd;
  font-size: 0.82rem;
  font-weight: 800;
  text-align: right;
  opacity: 0.95;
  flex: 0 0 auto;
  line-height: 1.1;
}

.overlay-status {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: min(360px, calc(100vw - 28px));
  pointer-events: none;
}

.overlay-card {
  border-radius: 14px;
  padding: 10px 12px;
  font-weight: 900;
  line-height: 1.4;
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow);
  border: 1px solid rgba(255,255,255,0.12);
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 0.84rem;
}

.overlay-card.info {
  background: rgba(15,23,42,0.92);
  color: #dbeafe;
}

.overlay-card.warn {
  background: rgba(120,53,15,0.92);
  color: #fde68a;
  border-color: rgba(245,158,11,0.35);
}

.overlay-card.error {
  background: rgba(127,29,29,0.94);
  color: #fee2e2;
  border-color: rgba(239,68,68,0.4);
}

.hidden { display: none !important; }

/* empty */
.empty-desktop,
.empty-mobile {
  flex: 1 1 auto;
  min-height: 0;
}

.empty-desktop-box,
.empty-mobile-box {
  width: 100%;
  height: 100%;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #94a3b8;
  font-weight: 900;
  line-height: 1.6;
}

.empty-desktop-box {
  background: var(--board-panel);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  box-shadow: var(--shadow);
  font-size: 1.45rem;
}

.empty-mobile-box {
  background: var(--board-panel);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px;
  box-shadow: var(--shadow);
  font-size: 1.22rem;
}

/* auto switch */
@media (max-width: 1300px), (orientation: portrait) {
  body {
    overflow: hidden;
  }

  .board-wrap.desktop-layout {
    display: none;
  }

  .board-mobile-list {
    display: flex;
  }
}

@media (min-width: 1301px) and (orientation: landscape) {
  .board-wrap.desktop-layout {
    display: block;
  }

  .board-mobile-list {
    display: none;
  }
}

@media (max-width: 980px) {
  .app {
    padding: 10px;
  }

  .board-toolbar {
    align-items: flex-start;
  }

  .board-toolbar-right {
    justify-content: flex-start;
  }

  .toolbar-chip-row {
    justify-content: flex-start;
  }

  .board-title {
    font-size: 2rem;
  }

  .board-time {
    font-size: 1.05rem;
  }

  .inline-note {
    font-size: 0.82rem;
  }

  .mobile-room-body {
    grid-template-columns: 1fr;
  }

  .mobile-current-ticket {
    font-size: 1.8rem;
  }

  .mobile-room-no {
    font-size: 2.35rem;
  }

  .overlay-status {
    left: 10px;
    right: 10px;
    bottom: 10px;
    max-width: none;
  }
}

@media (max-width: 520px) {
  body {
    overflow: auto;
  }

  .app {
    min-height: auto;
  }

  #displayBoard {
    overflow: visible;
  }

  .board-mobile-list {
    overflow: visible;
  }

  .board-title {
    font-size: 1.72rem;
  }

  .board-subtitle {
    font-size: 0.82rem;
  }

  .mobile-room-head {
    grid-template-columns: 58px 1fr;
  }

  .mobile-room-status {
    grid-column: 1 / -1;
    flex-direction: row;
    align-items: center;
    justify-content: flex-start;
    flex-wrap: wrap;
  }
}
</style>
</head>
<body>
<div class="app">
  <div class="board-toolbar">
    <div class="board-title-wrap">
      <div class="board-title">候診情況</div>
      <div class="board-subtitle">Queue Status</div>
    </div>

    <div class="board-toolbar-right">
      <div class="toolbar-chip-row">
        <div class="toolbar-chip status-ok" id="connectionChip">連線正常</div>
        <div class="toolbar-chip" id="roomsChip">診室：—</div>
      </div>
      <button class="toolbar-btn" id="fullscreenBtn" type="button">全螢幕</button>
      <div class="board-time" id="boardTime"></div>
    </div>
  </div>

  <div class="info-card">
    <div class="inline-note">
      輪候情況只供參考，會因應病人臨床需要及現場實際運作而作出調整，敬請見諒。<br>
      This queue is for reference only and may be adjusted at any time according to patients' clinical needs and operational requirements. Thank you for your understanding.
    </div>
  </div>

  <div id="displayBoard"></div>
  <div class="board-footer-tip">急症醫學中心<br>Emergency Medicine Centre</div>
</div>

<div class="overlay-status" id="overlayStatus">
  <div class="overlay-card info hidden" id="loadingOverlay">正在同步資料…</div>
  <div class="overlay-card warn hidden" id="offlineOverlay">網絡可能中斷，系統正嘗試重新連線…</div>
  <div class="overlay-card error hidden" id="errorOverlay"></div>
</div>

<script>
const SUPABASE_URL = "https://dvyberdrmmfgutjqnpjr.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR2eWJlcmRybW1mZ3V0anFucGpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MDc3NTMsImV4cCI6MjA5MTQ4Mzc1M30.9aRRSP2xAAozx2bxH9a1Z13tDDwot82Mb8ax5hxirck";

if (!window.supabase || typeof window.supabase.createClient !== "function") {
  document.body.innerHTML = `
    <div style="padding:24px;font-family:Arial,sans-serif;color:#fff;background:#06101f;min-height:100vh;">
      <h2 style="margin:0 0 12px;">系統初始化失敗</h2>
      <div>Supabase SDK 未能載入，請檢查網絡或 CDN 是否可用。</div>
    </div>
  `;
  throw new Error("Supabase SDK not loaded");
}

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const HKT_TIMEZONE = "Asia/Hong_Kong";
const BOARD_ROOMS_PER_PAGE = 3;
const BOARD_PAGE_ROTATE_MS = 8000;
const POLLING_MS = 10000;

const cloudState = {
  loading: false,
  online: navigator.onLine,
  lastSuccessAt: null
};

const state = {
  rooms: [],
  patients: [],
  displayPageIndex: 0,
  lastBoardRenderKey: ""
};

let liveRefreshTimer = null;
let boardClockTimer = null;
let boardPageRotateTimer = null;
let realtimeChannel = null;
let refreshInFlight = false;
let queuedRefresh = false;

function nowIso() {
  return new Date().toISOString();
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getHktDateParts(date = new Date()) {
  const formatter = new Intl.DateTimeFormat("en-CA", {
    timeZone: HKT_TIMEZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  });
  const parts = formatter.formatToParts(date);
  const map = {};
  for (const p of parts) {
    if (p.type !== "literal") map[p.type] = p.value;
  }
  return {
    year: map.year,
    month: map.month,
    day: map.day,
    hour: map.hour,
    minute: map.minute,
    second: map.second
  };
}

function formatDateTime(iso) {
  if (!iso) return "—";
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "—";
  return new Intl.DateTimeFormat("zh-HK", {
    timeZone: HKT_TIMEZONE,
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).format(date);
}

function formatBoardNow(date = new Date()) {
  const p = getHktDateParts(date);
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second}`;
}

function formatRegisteredInline(iso) {
  const text = formatDateTime(iso);
  return text === "—" ? "—" : `${text}｜登記`;
}

function setLoadingState(loading) {
  cloudState.loading = !!loading;
  const el = document.getElementById("loadingOverlay");
  if (!el) return;
  el.classList.toggle("hidden", !cloudState.loading);
}

function setBoardError(message = "") {
  const el = document.getElementById("errorOverlay");
  if (!el) return;
  el.textContent = String(message || "").trim();
  el.classList.toggle("hidden", !message);
}

function clearBoardError() {
  setBoardError("");
}

function setConnectionStatus(ok) {
  cloudState.online = !!ok;

  const chip = document.getElementById("connectionChip");
  if (chip) {
    chip.classList.remove("status-ok", "status-warn");
    if (ok) {
      chip.classList.add("status-ok");
      chip.textContent = "連線正常";
    } else {
      chip.classList.add("status-warn");
      chip.textContent = "重新連線中";
    }
  }

  const offline = document.getElementById("offlineOverlay");
  if (offline) {
    offline.classList.toggle("hidden", !!ok);
  }
}

function updateBoardStatusChips(visibleRooms = []) {
  const roomsChip = document.getElementById("roomsChip");
  if (roomsChip) roomsChip.textContent = `診室：${visibleRooms.length}`;
}

function initFullscreenButton() {
  const btn = document.getElementById("fullscreenBtn");
  if (!btn) return;

  btn.addEventListener("click", async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.warn("Fullscreen failed:", error);
    }
  });
}

function formatSupabaseError(error) {
  if (!error) return "unknown error";
  if (typeof error === "string") return error;
  const parts = [];
  if (error.message) parts.push(`message: ${error.message}`);
  if (error.code) parts.push(`code: ${error.code}`);
  if (error.details) parts.push(`details: ${error.details}`);
  if (error.hint) parts.push(`hint: ${error.hint}`);
  return parts.join(" | ") || JSON.stringify(error);
}

function mapSupabasePatientRow(patient) {
  return {
    id: patient.id,
    ticketNo: patient.ticket_no,
    cumcNo: patient.cumc_no,
    roomId: patient.room_id || "",
    sourceType: patient.source_type || "walkin",
    priority: !!patient.priority,
    registeredAt: patient.registered_at || nowIso(),
    status: patient.status || "waiting",
    createdAt: patient.created_at || nowIso(),
    queueOrder: Number.isFinite(patient.queue_order) ? patient.queue_order : null,
    skippedAt: patient.skipped_at || null,
    calledAt: patient.called_at || null,
    doneAt: patient.done_at || null,
    cancelledAt: patient.cancelled_at || null,
    encounterNo: patient.encounter_no || null
  };
}

function sortedRooms() {
  return [...state.rooms].sort((a, b) => a.roomNo.localeCompare(b.roomNo, "zh-HK", { numeric: true }));
}

function getRoom(roomId) {
  return state.rooms.find(room => room.id === roomId) || null;
}

function getPatient(patientId) {
  return state.patients.find(patient => patient.id === patientId) || null;
}

function getRoomDisplayShort(roomNo) {
  return String(roomNo || "").replace(/號房/g, "").trim() || String(roomNo || "");
}

function getPatientDisplayNo(patient) {
  return String(patient?.cumcNo || patient?.ticketNo || "").trim();
}

function getPatientTypeWeight(patient) {
  if (patient.sourceType === "appointment") return 1;
  if (patient.sourceType === "onlineTicket") return 2;
  return 3;
}

function compareWaitingBase(a, b) {
  if (!!a.priority !== !!b.priority) return a.priority ? -1 : 1;

  const aTime = new Date(a.registeredAt || a.createdAt).getTime();
  const bTime = new Date(b.registeredAt || b.createdAt).getTime();
  if (aTime !== bTime) return aTime - bTime;

  const aType = getPatientTypeWeight(a);
  const bType = getPatientTypeWeight(b);
  if (aType !== bType) return aType - bType;

  const aCreated = new Date(a.createdAt).getTime();
  const bCreated = new Date(b.createdAt).getTime();
  if (aCreated !== bCreated) return aCreated - bCreated;

  return getPatientDisplayNo(a).localeCompare(getPatientDisplayNo(b), "zh-HK");
}

function getOrderedWaitingPatients(room) {
  const waiting = state.patients
    .filter(patient => patient.roomId === room.id && patient.status === "waiting");

  waiting.sort((a, b) => {
    const aOrder = Number.isFinite(a.queueOrder) ? a.queueOrder : null;
    const bOrder = Number.isFinite(b.queueOrder) ? b.queueOrder : null;
    if (aOrder !== null && bOrder !== null && aOrder !== bOrder) return aOrder - bOrder;
    if (aOrder !== null && bOrder === null) return -1;
    if (aOrder === null && bOrder !== null) return 1;
    return compareWaitingBase(a, b);
  });

  return waiting;
}

function getReviewWaitingPatients(room) {
  return state.patients
    .filter(patient => patient.roomId === room.id && patient.status === "review_waiting")
    .sort(compareWaitingBase);
}

function getSkippedPatients(room) {
  return state.patients
    .filter(patient => patient.roomId === room.id && patient.status === "skipped")
    .sort((a, b) => {
      const aTime = new Date(a.skippedAt || a.createdAt).getTime();
      const bTime = new Date(b.skippedAt || b.createdAt).getTime();
      if (aTime !== bTime) return aTime - bTime;
      return getPatientDisplayNo(a).localeCompare(getPatientDisplayNo(b), "zh-HK");
    });
}

function splitDoctorName(fullName) {
  const text = String(fullName || "").trim();
  const match = text.match(/^(.*?醫生)\s*(Dr\..*)$/i);
  if (match) return { zh: match[1].trim(), en: match[2].trim() };
  return { zh: text, en: "" };
}

function getBoardPatientColorClass(patient) {
  if (!patient) return "";
  if (patient.priority) return "tag-priority";
  if (patient.sourceType === "appointment" || patient.sourceType === "onlineTicket") {
    return "tag-yellow";
  }
  return "";
}

function renderBoardTag(patient, type = "waiting") {
  const extraClass = getBoardPatientColorClass(patient);
  const typeClass = type === "review" ? "tag-review" : type === "skip" ? "tag-skip" : "";
  return `<span class="board-tag ${typeClass} ${extraClass}">${escapeHtml(getPatientDisplayNo(patient))}</span>`;
}

function getVisibleBoardRooms() {
  return sortedRooms().filter(room => room.status !== "closed");
}

function getBoardTotalPages(rooms) {
  return Math.max(1, Math.ceil(rooms.length / BOARD_ROOMS_PER_PAGE));
}

function normalizeBoardPageIndex(totalPages) {
  if (totalPages <= 0) {
    state.displayPageIndex = 0;
    return;
  }
  if (state.displayPageIndex >= totalPages) state.displayPageIndex = 0;
  if (state.displayPageIndex < 0) state.displayPageIndex = 0;
}

function getBoardRenderModel() {
  const visibleRooms = getVisibleBoardRooms();
  const totalPages = getBoardTotalPages(visibleRooms);
  normalizeBoardPageIndex(totalPages);
  const startIndex = state.displayPageIndex * BOARD_ROOMS_PER_PAGE;
  const pageRooms = visibleRooms.slice(startIndex, startIndex + BOARD_ROOMS_PER_PAGE);
  return { visibleRooms, totalPages, pageRooms };
}

function renderDesktopRows(pageRooms) {
  return pageRooms.map(room => {
    const currentPatient = room.currentPatientId ? getPatient(room.currentPatientId) : null;
    const doctorParts = splitDoctorName(room.doctorName);

    const waitingAll = getOrderedWaitingPatients(room);
    const waitingPatients = waitingAll.slice(0, 12);
    const waitingMore = Math.max(0, waitingAll.length - waitingPatients.length);

    const reviewAll = getReviewWaitingPatients(room);
    const reviewPatients = reviewAll.slice(0, 8);
    const reviewMore = Math.max(0, reviewAll.length - reviewPatients.length);

    const skippedAll = getSkippedPatients(room);
    const skippedPatients = skippedAll.slice(0, 8);
    const skippedMore = Math.max(0, skippedAll.length - skippedPatients.length);

    const currentBoardContent = room.status === "paused"
      ? `
        <div class="board-paused">暫停 Paused</div>
        ${room.pauseReason ? `<div class="board-meta">原因：${escapeHtml(room.pauseReason)}</div>` : ""}
      `
      : `
        ${
          currentPatient
            ? `
              <div class="board-current-ticket ${
                currentPatient.priority
                  ? "board-current-ticket-red"
                  : (currentPatient.sourceType === "appointment" || currentPatient.sourceType === "onlineTicket")
                    ? "board-current-ticket-yellow"
                    : "board-current-ticket-green"
              }">
                ${escapeHtml(getPatientDisplayNo(currentPatient))}
              </div>
              <div class="board-meta">${escapeHtml(formatRegisteredInline(currentPatient.registeredAt))}</div>
            `
            : `<div class="board-current-normal-ticket">—</div>`
        }
      `;

    return `
      <div class="board-row">
        <div class="board-cell board-room">${escapeHtml(getRoomDisplayShort(room.roomNo))}</div>
        <div class="board-cell board-doctor">
          <div class="board-doctor-zh">${escapeHtml(doctorParts.zh)}</div>
          ${doctorParts.en ? `<div class="board-doctor-en">${escapeHtml(doctorParts.en)}</div>` : ""}
        </div>
        <div class="board-cell board-current">${currentBoardContent}</div>
        <div class="board-cell">
          <div class="board-queue">
            ${
              (() => {
                const waitingHtml = waitingPatients.length
                  ? waitingPatients.map(patient => renderBoardTag(patient, "waiting")).join("") +
                    (waitingMore > 0 ? `<span class="board-empty">+${waitingMore}</span>` : "")
                  : `<span class="board-empty">—</span>`;

                const cutoffHtml = (room.status === "open" && room.acceptingNew === false)
                  ? `
                    <span class="board-cutoff-tag">
                      <span class="board-cutoff-zh">停收新症</span>
                      <span class="board-cutoff-en">NO NEW</span>
                    </span>
                  `
                  : "";

                return waitingHtml + cutoffHtml;
              })()
            }
          </div>
        </div>
        <div class="board-cell">
          <div class="board-review">
            ${
              reviewPatients.length
                ? reviewPatients.map(patient => renderBoardTag(patient, "review")).join("") +
                  (reviewMore > 0 ? `<span class="board-empty">+${reviewMore}</span>` : "")
                : `<span class="board-empty">—</span>`
            }
          </div>
        </div>
        <div class="board-cell">
          <div class="board-skip">
            ${
              skippedPatients.length
                ? skippedPatients.map(patient => renderBoardTag(patient, "skip")).join("") +
                  (skippedMore > 0 ? `<span class="board-empty">+${skippedMore}</span>` : "")
                : `<span class="board-empty">—</span>`
            }
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function renderMobileCards(pageRooms) {
  return pageRooms.map(room => {
    const currentPatient = room.currentPatientId ? getPatient(room.currentPatientId) : null;
    const doctorParts = splitDoctorName(room.doctorName);

    const waitingAll = getOrderedWaitingPatients(room);
    const waitingPatients = waitingAll.slice(0, 12);
    const waitingMore = Math.max(0, waitingAll.length - waitingPatients.length);

    const reviewAll = getReviewWaitingPatients(room);
    const reviewPatients = reviewAll.slice(0, 8);
    const reviewMore = Math.max(0, reviewAll.length - reviewPatients.length);

    const skippedAll = getSkippedPatients(room);
    const skippedPatients = skippedAll.slice(0, 8);
    const skippedMore = Math.max(0, skippedAll.length - skippedPatients.length);

    const currentHtml = room.status === "paused"
      ? `
        <div class="mobile-current-box">
          <div class="mobile-current-label">現正診症 / NOW</div>
          <div class="mobile-current-ticket board-paused">暫停</div>
          ${room.pauseReason ? `<div class="board-meta">原因：${escapeHtml(room.pauseReason)}</div>` : ""}
        </div>
      `
      : `
        <div class="mobile-current-box">
          <div class="mobile-current-label">現正診症 / NOW</div>
          <div class="mobile-current-ticket ${
            currentPatient
              ? (currentPatient.priority
                  ? "board-current-ticket-red"
                  : (currentPatient.sourceType === "appointment" || currentPatient.sourceType === "onlineTicket")
                    ? "board-current-ticket-yellow"
                    : "board-current-ticket-green")
              : ""
          }">
            ${currentPatient ? escapeHtml(getPatientDisplayNo(currentPatient)) : "—"}
          </div>
          ${currentPatient ? `<div class="board-meta">${escapeHtml(formatRegisteredInline(currentPatient.registeredAt))}</div>` : ""}
        </div>
      `;

    return `
      <div class="mobile-room-card">
        <div class="mobile-room-head">
          <div class="mobile-room-no">${escapeHtml(getRoomDisplayShort(room.roomNo))}</div>

          <div class="mobile-room-doctor">
            <div class="board-doctor-zh">${escapeHtml(doctorParts.zh)}</div>
            ${doctorParts.en ? `<div class="board-doctor-en">${escapeHtml(doctorParts.en)}</div>` : ""}
          </div>

          <div class="mobile-room-status">
            <div class="toolbar-chip ${room.status === "open" ? "status-ok" : "status-warn"}">
              ${room.status === "open" ? "開放" : room.status === "paused" ? "暫停" : "關閉"}
            </div>
            <div class="toolbar-chip ${room.acceptingNew ? "" : "status-warn"}">
              ${room.acceptingNew ? "接受新症" : "停收新症"}
            </div>
          </div>
        </div>

        <div class="mobile-room-body">
          <div class="mobile-section">
            <div class="mobile-section-title">
              <span>現正診症</span>
              <small>NOW</small>
            </div>
            ${currentHtml}
          </div>

          <div class="mobile-section">
            <div class="mobile-section-title">
              <span>候診</span>
              <small>WAITING ${waitingAll.length}</small>
            </div>
            <div class="mobile-tag-list">
              ${
                waitingPatients.length
                  ? waitingPatients.map(patient => renderBoardTag(patient, "waiting")).join("") +
                    (waitingMore > 0 ? `<span class="mobile-empty">+${waitingMore}</span>` : "") +
                    ((room.status === "open" && room.acceptingNew === false)
                      ? `
                        <span class="board-cutoff-tag">
                          <span class="board-cutoff-zh">停收新症</span>
                          <span class="board-cutoff-en">NO NEW</span>
                        </span>
                      `
                      : "")
                  : `<span class="mobile-empty">—</span>`
              }
            </div>
          </div>

          <div class="mobile-section">
            <div class="mobile-section-title">
              <span>回診</span>
              <small>REVIEW ${reviewAll.length}</small>
            </div>
            <div class="mobile-tag-list">
              ${
                reviewPatients.length
                  ? reviewPatients.map(patient => renderBoardTag(patient, "review")).join("") +
                    (reviewMore > 0 ? `<span class="mobile-empty">+${reviewMore}</span>` : "")
                  : `<span class="mobile-empty">—</span>`
              }
            </div>
          </div>

          <div class="mobile-section">
            <div class="mobile-section-title">
              <span>過號</span>
              <small>MISSED ${skippedAll.length}</small>
            </div>
            <div class="mobile-tag-list">
              ${
                skippedPatients.length
                  ? skippedPatients.map(patient => renderBoardTag(patient, "skip")).join("") +
                    (skippedMore > 0 ? `<span class="mobile-empty">+${skippedMore}</span>` : "")
                  : `<span class="mobile-empty">—</span>`
              }
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function renderDisplayBoard(force = false) {
  const container = document.getElementById("displayBoard");
  const timeEl = document.getElementById("boardTime");
  if (!container || !timeEl) return;

  const nextTimeText = formatBoardNow(new Date());
  if (timeEl.textContent !== nextTimeText) timeEl.textContent = nextTimeText;

  const { visibleRooms, totalPages, pageRooms } = getBoardRenderModel();
  updateBoardStatusChips(visibleRooms);

  if (!visibleRooms.length) {
    const html = `
      <div class="empty-desktop board-wrap desktop-layout">
        <div class="empty-desktop-box">
          <div>
            目前沒有顯示中的診室<br>No rooms currently displayed
          </div>
        </div>
      </div>
      <div class="empty-mobile board-mobile-list">
        <div class="empty-mobile-box">
          <div>
            目前沒有顯示中的診室<br>No rooms currently displayed
          </div>
        </div>
      </div>
    `;
    if (force || state.lastBoardRenderKey !== html) {
      container.innerHTML = html;
      state.lastBoardRenderKey = html;
    }
    return;
  }

  const dotsHtml = Array.from({ length: totalPages }, (_, i) => `
    <span class="board-dot ${i === state.displayPageIndex ? "active" : ""}"></span>
  `).join("");

  const desktopRows = renderDesktopRows(pageRooms);
  const mobileCards = renderMobileCards(pageRooms);

  const html = `
    <div class="board-pagination-bar">
      <div class="board-page-indicator">第 ${state.displayPageIndex + 1} 頁 / 共 ${totalPages} 頁</div>
      <div class="board-page-dots">${dotsHtml}</div>
    </div>

    <div class="board-wrap desktop-layout">
      <div class="board-head">
        <div><span class="board-head-zh">診室</span><span class="board-head-en">ROOM</span></div>
        <div><span class="board-head-zh">醫生</span><span class="board-head-en">DOCTOR</span></div>
        <div><span class="board-head-zh">現正診症</span><span class="board-head-en">NOW</span></div>
        <div><span class="board-head-zh">候診</span><span class="board-head-en">WAITING</span></div>
        <div><span class="board-head-zh">回診</span><span class="board-head-en">REVIEW</span></div>
        <div><span class="board-head-zh">過號</span><span class="board-head-en">MISSED</span></div>
      </div>
      <div class="board-body">${desktopRows}</div>
    </div>

    <div class="board-mobile-list">${mobileCards}</div>
  `;

  if (force || state.lastBoardRenderKey !== html) {
    container.innerHTML = html;
    state.lastBoardRenderKey = html;
  }
}

async function loadStateFromSupabase(showErrorToast = true) {
  try {
    const { data: roomsData, error: roomsError } = await sb.from("rooms").select("*").order("room_no", { ascending: true });
    if (roomsError) throw roomsError;

    const { data: patientsData, error: patientsError } = await sb.from("patients").select("*").order("created_at", { ascending: true });
    if (patientsError) throw patientsError;

    state.rooms = (roomsData || []).map(room => ({
      id: room.id,
      roomNo: room.room_no,
      doctorName: room.doctor_name || "",
      status: room.status || "open",
      pauseReason: room.pause_reason || "",
      acceptingNew: room.accepting_new !== false,
      currentPatientId: room.current_patient_id || null
    }));

    state.patients = (patientsData || []).map(mapSupabasePatientRow);

    cloudState.lastSuccessAt = nowIso();
    setConnectionStatus(true);
    clearBoardError();
    return true;
  } catch (error) {
    console.error("Failed to load from Supabase:", error);
    setConnectionStatus(false);
    setBoardError("讀取雲端資料失敗，系統會自動重試。");
    if (showErrorToast) console.warn("讀取雲端資料失敗\n" + formatSupabaseError(error));
    return false;
  }
}

async function refreshFromCloudAndRender(showErrorToast = false, showLoader = false) {
  if (refreshInFlight) {
    queuedRefresh = true;
    return false;
  }

  refreshInFlight = true;

  try {
    if (showLoader) setLoadingState(true);
    const ok = await loadStateFromSupabase(showErrorToast);
    if (!ok) return false;
    renderDisplayBoard(false);
    return true;
  } finally {
    if (showLoader) setLoadingState(false);
    refreshInFlight = false;
    if (queuedRefresh) {
      queuedRefresh = false;
      refreshFromCloudAndRender(false, false);
    }
  }
}

function startBoardPageRotation() {
  if (boardPageRotateTimer) clearInterval(boardPageRotateTimer);
  boardPageRotateTimer = setInterval(() => {
    const visibleRooms = getVisibleBoardRooms();
    const totalPages = getBoardTotalPages(visibleRooms);

    if (totalPages <= 1) {
      state.displayPageIndex = 0;
      renderDisplayBoard(false);
      return;
    }
    state.displayPageIndex = (state.displayPageIndex + 1) % totalPages;
    renderDisplayBoard(true);
  }, BOARD_PAGE_ROTATE_MS);
}

async function setupRealtimeAndPolling() {
  if (realtimeChannel) {
    try { await sb.removeChannel(realtimeChannel); } catch (e) { console.warn("removeChannel failed", e); }
  }

  realtimeChannel = sb
    .channel("emc-cqms-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "rooms" }, async () => {
      await refreshFromCloudAndRender(false);
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "patients" }, async () => {
      await refreshFromCloudAndRender(false);
    })
    .subscribe((status, err) => {
      console.log("Realtime subscribe status:", status, err || "");
      if (status === "SUBSCRIBED") {
        setConnectionStatus(true);
      }
      if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        setConnectionStatus(false);
        setBoardError("Realtime 連線異常，系統已切換為自動刷新。");
      }
    });

  if (liveRefreshTimer) clearInterval(liveRefreshTimer);
  liveRefreshTimer = setInterval(async () => {
    await refreshFromCloudAndRender(false);
  }, POLLING_MS);

  if (boardClockTimer) clearInterval(boardClockTimer);
  boardClockTimer = setInterval(() => {
    const timeEl = document.getElementById("boardTime");
    if (timeEl) {
      const nextTimeText = formatBoardNow(new Date());
      if (timeEl.textContent !== nextTimeText) timeEl.textContent = nextTimeText;
    }
  }, 1000);

  startBoardPageRotation();
}

async function initApp() {
  initFullscreenButton();

  window.addEventListener("online", () => {
    setConnectionStatus(true);
    clearBoardError();
    refreshFromCloudAndRender(false);
  });

  window.addEventListener("offline", () => {
    setConnectionStatus(false);
    setBoardError("目前網絡離線，系統會在恢復連線後自動同步。");
  });

  window.addEventListener("resize", () => {
    renderDisplayBoard(true);
  });

  window.addEventListener("orientationchange", () => {
    setTimeout(() => renderDisplayBoard(true), 120);
  });

  const ok = await refreshFromCloudAndRender(true, true);
  if (ok) renderDisplayBoard(true);

  document.getElementById("boardTime").textContent = formatBoardNow(new Date());
  await setupRealtimeAndPolling();
}

initApp();
